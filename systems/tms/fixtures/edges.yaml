  - {id: OCEAN-CNSHA-ZADUR, origin_id: CNSHA, destination_id: ZADUR, mode: ocean}
  - {id: OCEAN-ZADUR-DEHAM, origin_id: ZADUR, destination_id: DEHAM, mode: ocean}
  - {id: OCEAN-CNSHA-USLAX, origin_id: CNSHA, destination_id: USLAX, mode: ocean}
