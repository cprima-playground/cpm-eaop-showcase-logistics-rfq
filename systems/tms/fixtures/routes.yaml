# Named commercial routes — curated, ordered paths over edges.yaml's
# reusable directed edge pool. 17 routes, referencing 29 distinct edges
# (with real reuse, e.g. RAIL-DEHAM-DEMUC used by 3 routes,
# OCEAN-ZADUR-DEHAM used by 2). `roles` are non-exclusive tags (a route can
# carry more than one); `applicability.applicable_disruption_tags` marks a
# route as a valid alternative when that disruption occurs (not "impacted
# by" it).
#
# Lane CNSHA-DEMUC has 8 routes carrying that lane (SHA-HAM-MUC ..
# SHA-GDN-MUC, SHA-CPE-MUC). 4 further lanes add geographic diversity:
# Transpacific (CNSHA-USLAX), Middle-East/Suez (AEJEA-DEHAM, with a
# Cape-of-Good-Hope alternate), Intra-Europe (NLRTM-ITMIL, single route, no
# alternative), Transatlantic (DEHAM-USNYC, with Rotterdam + Antwerp
# alternates).
#
# hamburg_ocean_gateway_unavailable means specifically the OCEAN
# terminal/vessel-call at Hamburg is blocked -- not that Hamburg as a
# location is entirely inaccessible. SHA-RTM-MUC/SHA-ANR-MUC/TAT-RTM/
# TAT-ANR all avoid an ocean departure from Hamburg; TAT-RTM/TAT-ANR still
# legitimately depart Hamburg by rail (an inland movement, not an ocean
# one) en route to their actual alternate ocean port.
#
# Durations are plausible (ocean slow, rail medium, air fast). Costs are
# NOT here -- they are derived, correlated + seeded (rate/fixtures/cost-model.md).
routes:
  - id: SHA-HAM-MUC            # r1 -- the CONTRACTED lane
    lane_id: CNSHA-DEMUC
    roles: [primary, contracted]
    edges:
      - {edge_id: OCEAN-CNSHA-DEHAM, indicative_duration_days: 27}
      - {edge_id: RAIL-DEHAM-DEMUC, indicative_duration_days: 2}

  - id: SHA-RTM-MUC            # r2 -- Rotterdam alternative (via Duisburg, TEN-T)
    lane_id: CNSHA-DEMUC
    roles: [alternative]
    applicability:
      applicable_disruption_tags: [hamburg_ocean_gateway_unavailable]
    edges:
      - {edge_id: OCEAN-CNSHA-NLRTM, indicative_duration_days: 26}
      - {edge_id: RAIL-NLRTM-DEDUI, indicative_duration_days: 1}
      - {edge_id: RAIL-DEDUI-DEMUC, indicative_duration_days: 1}

  - id: SHA-ANR-MUC            # r3 -- Antwerp alternative
    lane_id: CNSHA-DEMUC
    roles: [alternative]
    applicability:
      applicable_disruption_tags: [hamburg_ocean_gateway_unavailable]
    edges:
      - {edge_id: OCEAN-CNSHA-BEANR, indicative_duration_days: 28}
      - {edge_id: RAIL-BEANR-DEMUC, indicative_duration_days: 2}

  - id: PVG-FRA-MUC            # r4 -- air (fast, expensive)
    lane_id: CNSHA-DEMUC
    roles: [alternative]
    edges:
      - {edge_id: AIR-CNPVG-DEFRA, indicative_duration_days: 2}
      - {edge_id: ROAD-DEFRA-DEMUC, indicative_duration_days: 1}

  - id: SHA-PIR-MUC            # r5 -- Med gateway (TEN-T Orient/East-Med)
    lane_id: CNSHA-DEMUC
    roles: [alternative]
    edges:
      - {edge_id: OCEAN-CNSHA-GRPIR, indicative_duration_days: 22}
      - {edge_id: RAIL-GRPIR-DEMUC, indicative_duration_days: 5}

  - id: SHA-GOA-MUC            # r6 -- Genoa gateway
    lane_id: CNSHA-DEMUC
    roles: [alternative]
    edges:
      - {edge_id: OCEAN-CNSHA-ITGOA, indicative_duration_days: 24}
      - {edge_id: RAIL-ITGOA-DEMUC, indicative_duration_days: 3}

  - id: NGB-HAM-MUC            # r7 -- alternative origin (Ningbo), own lane
    lane_id: CNNGB-DEMUC
    roles: [primary]            # sole route on its lane
    edges:
      - {edge_id: OCEAN-CNNGB-DEHAM, indicative_duration_days: 27}
      - {edge_id: RAIL-DEHAM-DEMUC, indicative_duration_days: 2}

  - id: SHA-GDN-MUC            # r8 -- Baltic gateway
    lane_id: CNSHA-DEMUC
    roles: [alternative]
    edges:
      - {edge_id: OCEAN-CNSHA-PLGDN, indicative_duration_days: 30}
      - {edge_id: RAIL-PLGDN-DEMUC, indicative_duration_days: 3}

  - id: SHA-CPE-MUC            # r9 -- Cape of Good Hope escalation (Suez blocked)
    lane_id: CNSHA-DEMUC
    roles: [contingency]
    applicability:
      applicable_disruption_tags: [suez_unavailable]
    edges:
      # explicit ZADUR waypoint, not a single CNSHA->DEHAM edge: a future
      # graph-based route-finder over edges.yaml would otherwise always
      # pick the shortest CNSHA->DEHAM path (the Suez route) regardless of
      # which named route asked for it -- same pattern as MEA-CAPE below.
      - {edge_id: OCEAN-CNSHA-ZADUR, indicative_duration_days: 24}
      - {edge_id: OCEAN-ZADUR-DEHAM, indicative_duration_days: 16}
      - {edge_id: RAIL-DEHAM-DEMUC, indicative_duration_days: 2}

  - id: TPA-LAX                # Transpacific -- primary (Los Angeles)
    lane_id: CNSHA-USLAX
    roles: [primary]
    edges:
      - {edge_id: OCEAN-CNSHA-USLAX, indicative_duration_days: 14}

  - id: TPA-OAK                # Transpacific -- alternate (Oakland, inland to LA)
    lane_id: CNSHA-USLAX
    roles: [alternative]
    edges:
      - {edge_id: OCEAN-CNSHA-USOAK, indicative_duration_days: 15}
      - {edge_id: ROAD-USOAK-USLAX, indicative_duration_days: 1}

  - id: MEA-SUEZ                # Middle-East -- primary, via Suez Canal
    lane_id: AEJEA-DEHAM
    roles: [primary]
    edges:
      - {edge_id: OCEAN-AEJEA-DEHAM, indicative_duration_days: 18}

  - id: MEA-CAPE                # Middle-East -- alternate, Cape-of-Good-Hope
    lane_id: AEJEA-DEHAM
    roles: [contingency]
    applicability:
      applicable_disruption_tags: [suez_unavailable]
    edges:
      - {edge_id: OCEAN-AEJEA-ZADUR, indicative_duration_days: 16}
      - {edge_id: OCEAN-ZADUR-DEHAM, indicative_duration_days: 16}

  - id: EUR-MIL                # Intra-Europe -- single route, no alternative
    lane_id: NLRTM-ITMIL
    roles: [primary]            # sole route on its lane
    edges:
      - {edge_id: RAIL-NLRTM-ITMIL, indicative_duration_days: 3}

  - id: TAT-NYC                # Transatlantic -- primary (Hamburg)
    lane_id: DEHAM-USNYC
    roles: [primary]
    edges:
      - {edge_id: OCEAN-DEHAM-USNYC, indicative_duration_days: 9}

  - id: TAT-RTM                # Transatlantic -- alternate (Rotterdam, via Hamburg feeder)
    lane_id: DEHAM-USNYC
    roles: [alternative]
    applicability:
      applicable_disruption_tags: [hamburg_ocean_gateway_unavailable]
    edges:
      - {edge_id: RAIL-DEHAM-NLRTM, indicative_duration_days: 1}
      - {edge_id: OCEAN-NLRTM-USNYC, indicative_duration_days: 8}

  - id: TAT-ANR                # Transatlantic -- alternate (Antwerp, via Hamburg feeder)
    lane_id: DEHAM-USNYC
    roles: [alternative]
    applicability:
      applicable_disruption_tags: [hamburg_ocean_gateway_unavailable]
    edges:
      - {edge_id: RAIL-DEHAM-BEANR, indicative_duration_days: 1}
      - {edge_id: OCEAN-BEANR-USNYC, indicative_duration_days: 9}
