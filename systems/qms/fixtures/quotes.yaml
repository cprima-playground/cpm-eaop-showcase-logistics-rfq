# Baseline QMS quotes -- deterministic quote_ids (matches routes.yaml/rates.yaml's
# pinned-id convention). customer_id references masterdata Party (ADR-010) --
# ACME is the only kind=customer entry in parties.jsonl today, every quote here
# reuses it. rfq_id is a loose reference (RFQ isn't a QMS-owned store, see
# mock_qms/store.py's docstring) -- not all of these have a matching
# fixtures/rfqs/*.yaml entry, and that's fine.
#
# `versions: N` seeds a real v1..vN supersede chain at boot (see
# QmsStore._seed_quote) -- a handful of multi-version quotes here demonstrate
# the append-only history feature in the baseline itself, not just via a live
# POST .../versions call. All stay status=draft -- nothing beyond draft is
# buildable yet (pricing/R1-R6/Cedar wiring don't exist).
