# Job titles — real-world, research-grounded where sourced. Business-complete:
# includes titles with no identity/actors.yaml entry yet (exists_today: false).
#
# `responsibilities` for titles marked deeply-researched are pulled from real
# job postings (see business/personas.md for the full bullet lists + agent
# delegation mapping on the 4 titles this repricing subprocess implements
# today). Titles without a `sources` list are organizational placeholders --
# named so the org chart is complete, not yet responsibility-researched to
# the same depth. Deepen those before adding more identities, not instead of.

job_titles:
  # --- Commercial ---------------------------------------------------------
  - job_title_id: account-manager
    title: Account Manager
    department_id: commercial
    level: specialist
    exists_today: true            # human modeled this session (Finding 5's actor); crm itself remains unimplemented
    responsibilities:
      - Act as main liaison between customers, agents, and carriers on freight quote requests
      - Prepare quotes for international/domestic shipments (air, ocean, ground)
      - Manage RFQs for large-scale logistics contracts
      - Research/identify new business prospects
      - Maintain professional relationships with existing accounts
    sources:
      - {title: Indeed, url: "https://www.indeed.com/q-freight-forwarder-customer-service-jobs.html"}
      - {title: Staffmark Account Executive, url: "https://staffmark.com/jobs/detail/1001993831/account-executive-freight-forwarding-chandler-az/"}

  - job_title_id: sales-manager
    title: Sales Manager
    department_id: commercial
    level: manager
    exists_today: false
    responsibilities: []          # placeholder -- not yet researched to the same depth as Account Manager

  - job_title_id: regional-commercial-director
    title: Regional Commercial Director
    department_id: commercial
    level: director
    exists_today: true
    responsibilities:
      - Own regional commercial P&L and pricing governance
      - Escalation point above a Pricing Manager's approval limit
      - Approve pricing policy/discount structure changes for the region
      - Represent the region in cross-regional pricing alignment
    sources:
      - {title: "ISS Global Forwarding Pricing Manager (closest attested tier)", url: "https://iss-globalforwarding.com/jobs/pricing-manager-malaysia/"}

  - job_title_id: pricing-manager
    title: Pricing Manager
    department_id: commercial
    level: manager
    exists_today: true
    reports_to_job_title_id: regional-commercial-director
    responsibilities:
      - Develop/implement pricing strategies for profitability and competitiveness
      - Lead pricing governance -- standardized practices, discounting policy, approval protocols
      - Build rate approval structures and escalation protocols
      - Conduct profit margin analysis; review pricing strategy for competitiveness
      - Negotiate rates/contracts with carriers and vendors
      - Lead pricing reviews, internal approvals, proposal pricing milestones
    sources:
      - {title: ISS Global Forwarding Pricing Manager, url: "https://iss-globalforwarding.com/jobs/pricing-manager-malaysia/"}
      - {title: Indeed Freight Pricing Manager, url: "https://www.indeed.com/q-freight-pricing-manager-jobs.html"}

  # --- Pricing --------------------------------------------------------------
  - job_title_id: commercial-pricing-specialist
    title: Commercial Pricing Specialist
    department_id: pricing
    level: specialist
    exists_today: true
    reports_to_job_title_id: pricing-manager
    aliases: [Pricing Specialist, Freight Pricing Specialist, Pricing Executive, Tender & Pricing Specialist, Ocean/Air Freight Pricing Specialist]
    responsibilities:
      - Prepare freight quotations for Air, Sea (FCL/LCL), and Land
      - Coordinate with shipping lines, airlines, transporters, overseas agents for competitive rates
      - Support sales with timely, accurate pricing for inquiries and tenders
      - Maintain/update rate sheets, tariffs, pricing databases
      - Analyze market trends and freight rate fluctuations
      - Ensure quotations comply with company policy and service capability
    sources:
      - {title: ZipRecruiter Freight Forwarding Pricing Specialist, url: "https://www.ziprecruiter.com/Jobs/Freight-Forwarding-Pricing-Specialist"}
      - {title: Hellmann SSC Pricing Specialist, url: "https://careers.hellmann.com/en/jobs/ssc-pricing-specialist-seafreightairfreight"}

  # --- Planning ---------------------------------------------------------
  - job_title_id: transport-planner
    title: Transport Planner
    department_id: planning
    level: specialist
    exists_today: true
    responsibilities:
      - Plan, tender, and route daily shipments to meet cost/service parameters
      - Create optimized shipment routes (distance, time, traffic, customer requirements)
      - Identify lowest freight cost and best mode to maximize efficiency
      - Monitor load status; adjust plans for delays
      - Communicate with drivers and carriers
      - Analyze carrier trends, identify service issues
    sources:
      - {title: Velvet Jobs Transportation Planner, url: "https://www.velvetjobs.com/job-descriptions/transportation-planner"}
      - {title: JobDescription.org Load Planner, url: "https://jobdescription.org/jobs/transportation/load-planner"}

