  - job_title_id: operations-coordinator
    title: Operations Coordinator
    department_id: operations
    level: specialist
    exists_today: true            # human modeled this session; see business/capability-profiles/operations-coordinator.md
    responsibilities:
      - Schedule shipments, coordinate with carriers/drivers
      - Track freight in transit; resolve issues/delays proactively
      - Serve as primary customer contact for real-time tracking updates
      - Liaise with airlines, steamship lines, trucking partners
      - Coordinate/manage booking, documentation, customs clearance end-to-end
