      - Coordinate shipments with forwarders on rates
      - Generate export documentation compliant with regulations
      - Create bills of lading, shipping labels, export paperwork
      - Verify pricing on documents matches purchase orders
    sources:
      - {title: Velvet Jobs International Logistics Coordinator, url: "https://www.velvetjobs.com/job-descriptions/international-logistics-coordinator"}

