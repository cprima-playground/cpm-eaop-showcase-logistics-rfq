# Authored action vocabulary for the repricing subprocess.
#
# MIRRORS cpm-eaop data/policies/actions.yaml — SAME shape, SAME rules:
#   - dotted, namespaced action names (never YAML nesting)
#   - each action declares: principals (allowed principal entity types),
#     resources (allowed resource entity types), context (optional typed map)
#   - context type forms: bare (`Long`) or `{type: Long, required: false}`
#   - OWNED BY THE AUTHORIZATION MODEL. Authored here, never generated from a domain model.
#
# Cedar has no decimal type. Money is integer minor units (EUR cents). Percents are
# integer tenths-of-a-percent (2.7% -> 27). Documented so policy thresholds compare
# integers, not floats. This is a modelling choice, resolved at entity-build time.

actions:
  # --- Transport (ADR-001) ---------------------------------------------------
  # May this agent open an MCP session with this workload at all. Independent
  # of any specific tool call within that session.
  mcp.connect:
    principals: [AgentPrincipal]
    resources: [Workload]

  # --- A2A delegation (M3.5, can_call projection deferred from ADR-001) -----
  # May this agent hand off to that agent at all (transport-level, like
  # mcp.connect -- independent of which specific action the callee then
  # performs). agents/catalog.yaml's `can_call` graph is the source of the
  # allow-list, materialized into each AgentPrincipal's `can_call` attribute
  # by tools/identity/gen_cedar_entities.py.
  agent.delegate:
    principals: [AgentPrincipal]
    resources: [AgentPrincipal]
    context:
      skill: {type: String, required: false}   # M5a: A2A skill id being invoked (informational -- can_call is the enforced fact, not the skill name)

  # --- Lane Evaluation Agent ------------------------------------------------
  # executing_workload/tool (ADR-001): optional context carried on every
  # action interfaces/mcp/tools.yaml maps a tool to, so an MCP-mediated call
  # authorizes the initiating caller while naming which workload executed it.
  # Absent for non-MCP-mediated calls (e.g. a human via the QMS UI directly).
  lane.evaluate:
    principals: [AgentPrincipal]
    resources: [RFQ]
    context:
      executing_workload: {type: String, required: false}
      tool: {type: String, required: false}

  lane.option.create:
    principals: [AgentPrincipal]
    resources: [RFQ]

  capacity.check:
    principals: [AgentPrincipal]
    resources: [RouteOption]
    context:
      executing_workload: {type: String, required: false}
      tool: {type: String, required: false}

  carrier-rate.read:
    principals: [AgentPrincipal]
    resources: [RouteOption]
    context:
      executing_workload: {type: String, required: false}
      tool: {type: String, required: false}

  # --- Commercial Normalization Agent --------------------------------------
  fx-rate.read:
    principals: [AgentPrincipal]
    resources: [ExchangeRate]
    context:
      fx_age_seconds: Long
      quote_currency: String

  route-cost.normalize:
    principals: [AgentPrincipal]
    resources: [RouteOption]
    context:
      fx_age_seconds: Long
      target_currency: String
      executing_workload: {type: String, required: false}
      tool: {type: String, required: false}

  quote-price.calculate:
    principals: [AgentPrincipal]
    resources: [Quote]
    context:
      executing_workload: {type: String, required: false}
      tool: {type: String, required: false}

  quote-variance.evaluate:
    principals: [AgentPrincipal]
    resources: [Quote]
    context:
      fx_variance_pct_x10: Long          # tenths of a percent
      executing_workload: {type: String, required: false}
      tool: {type: String, required: false}

  # --- Route Decision Agent -------------------------------------------------
  route.recommend:
    principals: [AgentPrincipal]
    resources: [RFQ]
    context:
      cost_variance_pct_x10: Long
      transit_variance_days: Long
      margin_pct_x10: Long
      non_contracted_lane: Boolean
      executing_workload: {type: String, required: false}
      tool: {type: String, required: false}
      # delegated_by (M4a second checkpoint): the human who delegated this
      # call to the executing agent, if any -- accountability context, NOT
      # a principal swap (Cedar's principal stays the agent, per ADR-001
      # decision #3; this names who's accountable, it doesn't act as them).
      delegated_by: {type: String, required: false}

  route-deviation.propose:
    principals: [AgentPrincipal]
    resources: [RouteRecommendation]
    context:
      executing_workload: {type: String, required: false}
      tool: {type: String, required: false}

  quote.submit-for-approval:
    principals: [AgentPrincipal]
    resources: [Quote]
    context:
      fx_variance_pct_x10: Long
      margin_pct_x10: Long

  # approval.request: REMOVED (Finding 2, capability-profile review;
  # actually executed now -- the earlier fix removed agent OWNERSHIP in
  # agents/catalog.yaml but left this action definition in place, a real
  # gap flagged in review). ApprovalTask creation is a system-internal
  # consequence of quote.submit-for-approval's QMS state transition, not
  # an independently agent-authorizable action. Do not re-add without a
  # new ADR reversing Finding 2 -- see test_approval_request_stays_removed.

  # --- Human ----------------------------------------------------------------
  route-deviation.approve:
    principals: [Principal]
    resources: [RouteRecommendation]
    context:
      quote_value_eur_cents: Long
      fx_variance_pct_x10: Long
      margin_pct_x10: Long

  # --- Human: Commercial Governance (Finding 3, capability-profile review) --
  # mock_qms's real decision endpoint (mock_qms/store.py:378) supports THREE
  # outcomes -- approved | rejected | revise -- but until now Cedar only
  # modeled `route-deviation.approve`, a different resource type
  # (RouteRecommendation, not Quote) reused as a stand-in. business/
  # decisions.md's D19 was reserved for this (mock_qms/templates/
  # quote_detail.html:129's "D19-candidate" comment, written before this
  # action existed). quote.reject/quote.request-revision get their own
  # Cedar policies; only quote.approve keeps the value-limit gate --
  # declining a quote isn't committing the company to anything, so it
  # doesn't need the same threshold as approving one.
  quote.approve:
    principals: [Principal]
    resources: [Quote]
    context:
      quote_value_eur_cents: Long

  quote.reject:
    principals: [Principal]
    resources: [Quote]

  quote.request-revision:
    principals: [Principal]
    resources: [Quote]
