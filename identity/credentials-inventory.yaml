# Credential inventory — WHAT exists, never a value. See ADR-009.
# Storage (HOW it's protected) is env-conditional: Vault-dev (dev) / Secret
# Manager (test, prod) — deploy/environments.md.

credentials:
  - name: fx-api-key
    purpose: authenticates agent/system callers to the mock FX service (machine-only, no SSO)
    consumers: [mock-fx, commercial-normalization-agent, qms-mcp]
    environments: [dev, test, prod]
    owner: platform-team
    rotation: 90d
    vault_path: rfq/fx-api-key          # dev
    secret_manager_id: rfq-fx-api-key           # test/prod
    note: |
      qms-mcp's route-cost.normalize tool consults mock-fx directly (real
      fx_age_seconds for D2's already-decided freshness gate, then the
      real conversion via mock-fx's own /convert) -- reuses the shared
      key, same posture as tms-mcp/tms-api-key et al (decision #8).

  - name: masterdata-api-key
    purpose: authenticates agent/system callers to the masterdata source (machine-only, no SSO)
    consumers: [mock-masterdata, mock-fx, mock-tms, mock-rate, lane-evaluation-agent, commercial-normalization-agent, route-decision-agent, geo-api]
    environments: [dev, test, prod]
    owner: platform-team
    rotation: 90d
    vault_path: rfq/masterdata-api-key
    secret_manager_id: rfq-masterdata-api-key

  - name: tms-api-key
    purpose: authenticates agent/system callers to the mock TMS service (machine-only, no SSO)
    consumers: [mock-tms, lane-evaluation-agent, tms-mcp]
    environments: [dev, test, prod]
    owner: platform-team
    rotation: 90d
    vault_path: rfq/tms-api-key
    secret_manager_id: rfq-tms-api-key
    note: |
      tms-mcp reuses this shared key as its own transport credential to mock-tms
      (M6a) rather than minting a per-MCP-server key -- decision #8's accepted
      weaker-than-per-workload-token granularity, already the repo's existing
      posture for this hop (unchanged behavior for the other two consumers).
      A dedicated tms-mcp-api-key entry remains status:planned below for a
      future tightening, not activated by this milestone.

  - name: tms-mcp-svc-client-secret
    purpose: workload.tms-mcp's own Keycloak confidential-client secret, used to
      authenticate ITS token-introspection calls (RFC 7662) when verifying an
      agent's bearer token in tms-mcp's tool handlers (M6a) -- the resource
      server authenticates itself, distinct from the caller's own credential.
    consumers: [tms-mcp]
    environments: [dev]
    owner: platform-team
    rotation: 90d
    vault_path: rfq/tms-mcp-svc-client-secret
    seed: false
    note: value comes from the tms-mcp-svc client Keycloak already provisions
      (infra/keycloak/terraform's machine_identities for_each) -- fetched live
      via the Keycloak admin API and recorded here, same posture as
      qms-web-client-secret/ops-dashboard-web-client-secret above; seed.py must
      not overwrite it with a random value.

  - name: rate-api-key
    purpose: authenticates agent/system callers to the mock Rate service (machine-only, no SSO)
    consumers: [mock-rate, lane-evaluation-agent, rate-mcp]
    environments: [dev, test, prod]
    owner: platform-team
    rotation: 90d
    vault_path: rfq/rate-api-key
    secret_manager_id: rfq-rate-api-key
    note: |
      rate-mcp reuses this shared key as its own transport credential to
      mock-rate (M6, same posture tms-mcp/tms-api-key established in M6a)
      rather than minting a per-MCP-server key -- decision #8's accepted
      weaker-than-per-workload-token granularity for this hop.

  - name: rate-mcp-svc-client-secret
    purpose: workload.rate-mcp's own Keycloak confidential-client secret, used to
      authenticate ITS token-introspection calls (RFC 7662) when verifying an
      agent's bearer token in rate-mcp's tool handlers -- the resource server
      authenticates itself, distinct from the caller's own credential.
    consumers: [rate-mcp]
    environments: [dev]
    owner: platform-team
    rotation: 90d
    vault_path: rfq/rate-mcp-svc-client-secret
    seed: false
    note: value comes from the rate-mcp-svc client Keycloak already provisions
      (infra/keycloak/terraform's machine_identities for_each) -- fetched live
      via the Keycloak admin API and recorded here, same posture as
      tms-mcp-svc-client-secret above; seed.py must not overwrite it with a
      random value.

  - name: qms-api-key
    purpose: authenticates agent/system callers to the mock QMS service (machine-only, no SSO)
    consumers: [mock-qms, commercial-normalization-agent, qms-mcp, approval-mcp]
    environments: [dev, test, prod]
    owner: platform-team
    rotation: 90d
    vault_path: rfq/qms-api-key
    secret_manager_id: rfq-qms-api-key
    note: |
      qms-mcp AND approval-mcp both reuse this shared key as their own
      transport credential to mock-qms (M6, same posture tms-mcp/
      tms-api-key established) rather than minting a per-MCP-server key
      -- decision #8's accepted weaker-than-per-workload-token granularity
      for this hop. The two servers sharing mock-qms is only valid under
      ADR-002 because their EXPOSED action sets are disjoint (mechanically
      checked, see src/qms-mcp/tests/test_adr002_disjointness.py) -- this
      shared-key note documents the transport layer, not the authorization
      layer, and does not itself relax that requirement.

  - name: qms-mcp-svc-client-secret
    purpose: workload.qms-mcp's own Keycloak confidential-client secret, used to
      authenticate ITS token-introspection calls (RFC 7662) when verifying an
      agent's bearer token in qms-mcp's tool handlers -- the resource server
      authenticates itself, distinct from the caller's own credential.
    consumers: [qms-mcp]
    environments: [dev]
    owner: platform-team
    rotation: 90d
    vault_path: rfq/qms-mcp-svc-client-secret
    seed: false
    note: value comes from the qms-mcp-svc client Keycloak already provisions
      (infra/keycloak/terraform's machine_identities for_each) -- fetched live
      via the Keycloak admin API and recorded here, same posture as
      tms-mcp-svc-client-secret/rate-mcp-svc-client-secret above; seed.py must
      not overwrite it with a random value.

  - name: geo-api-svc-client-secret
    purpose: workload.geo-api's own Keycloak confidential-client secret, used to
      authenticate ITS token-introspection calls (RFC 7662) when verifying a
      caller's bearer token on GET /v1/legs/geometry -- the resource server
      authenticates itself, distinct from the caller's own credential. No API
      key exists for this workload (M10 D4 -- OIDC AuthN throughout, no mock-*
      shared-key hop -- geo-api has no mock backend).
    consumers: [geo-api]
    environments: [dev]
    owner: platform-team
    rotation: 90d
    vault_path: rfq/geo-api-svc-client-secret
    seed: false
    note: value comes from the geo-api-svc client Keycloak already provisions
      (infra/keycloak/terraform's machine_identities for_each) -- fetched live
      via the Keycloak admin API and recorded here, same posture as
      qms-mcp-svc-client-secret/approval-mcp-svc-client-secret above; seed.py
      must not overwrite it with a random value.

  - name: ops-dashboard-svc-client-secret
    purpose: workload.ops-dashboard's OWN Keycloak confidential-client secret,
      used ONLY for the client_credentials grant that obtains a bearer token
      for calling other workloads' bearer-token-protected APIs (geo-api's
      GET /v1/legs/geometry, M10) -- distinct from ops-dashboard-web-client-secret,
      which is the human-SSO Authorization Code client's secret and has never
      been used for outbound service calls.
    consumers: [ops-dashboard]
    environments: [dev]
    owner: platform-team
    rotation: 90d
    vault_path: rfq/ops-dashboard-svc-client-secret
    seed: false
    note: value comes from the ops-dashboard-svc client Keycloak already
      provisions (infra/keycloak/terraform's machine_identities for_each) --
      fetched live via the Keycloak admin API and recorded here, same posture
      as qms-mcp-svc-client-secret above; seed.py must not overwrite it with a
      random value.

  - name: approval-mcp-svc-client-secret
    purpose: workload.approval-mcp's own Keycloak confidential-client secret, used
      to authenticate ITS token-introspection calls (RFC 7662) when verifying an
      agent's bearer token in approval-mcp's tool handlers -- the resource server
      authenticates itself, distinct from the caller's own credential.
    consumers: [approval-mcp]
    environments: [dev]
    owner: platform-team
    rotation: 90d
    vault_path: rfq/approval-mcp-svc-client-secret
    seed: false
    note: value comes from the approval-mcp-svc client Keycloak already
      provisions (infra/keycloak/terraform's machine_identities for_each) --
      fetched live via the Keycloak admin API and recorded here, same posture
      as qms-mcp-svc-client-secret above; seed.py must not overwrite it with a
      random value.

  - name: keycloak-realm-admin-password
    purpose: bootstraps the rfq Keycloak realm (dev SSO)
    consumers: [keycloak]
    environments: [dev]
    owner: platform-team
    rotation: on-recreate
    vault_path: rfq/keycloak-admin

  - name: ops-dashboard-web-client-secret
    purpose: OIDC client secret for the ops-dashboard's Auth-Code+PKCE login (infra/keycloak/terraform)
    consumers: [ops-dashboard]
    environments: [dev]
    owner: platform-team
    rotation: on-recreate
    vault_path: rfq/ops-dashboard-web-client-secret
    seed: false
    note: value comes from `terraform output ops_dashboard_web_client_secret`, written to Vault manually via `infra/keycloak/terraform`'s own apply step (terraform state, not seed.py, is the source of truth) -- seed.py skips this entry rather than overwriting it with a random value

  - name: ops-dashboard-session-secret
    purpose: Starlette SessionMiddleware signing key for the ops-dashboard's login session cookie
    consumers: [ops-dashboard]
    environments: [dev]
    owner: platform-team
    rotation: 90d
    vault_path: rfq/ops-dashboard-session-secret

  - name: qms-web-client-secret
    purpose: OIDC client secret for the QMS frontend's Auth-Code+PKCE login (infra/keycloak/terraform)
    consumers: [mock-qms]
    environments: [dev]
    owner: platform-team
    rotation: on-recreate
    vault_path: rfq/qms-web-client-secret
    seed: false
    note: value comes from `terraform output qms_web_client_secret`, written to Vault manually via `infra/keycloak/terraform`'s own apply step (terraform state, not seed.py, is the source of truth) -- seed.py skips this entry rather than overwriting it with a random value

  - name: qms-session-secret
    purpose: Starlette SessionMiddleware signing key for the QMS frontend's login session cookie
    consumers: [mock-qms]
    environments: [dev]
    owner: platform-team
    rotation: 90d
    vault_path: rfq/qms-session-secret

  - name: lane-evaluation-agent-client-secret
    purpose: agent service-account credential (client-credentials flow, dev only)
    consumers: [lane-evaluation-agent]
    environments: [dev]
    owner: platform-team
    rotation: 90d
    vault_path: rfq/agents/lane-evaluation-agent-svc
    seed: false
    note: value comes from the lane-evaluation-agent-svc client Keycloak already
      provisions (infra/keycloak/terraform's machine_identities for_each) --
      fetched live via the Keycloak admin API and recorded here, same posture
      as qms-mcp-svc-client-secret above; seed.py must not overwrite it with a
      random value. Found live -- this entry was missing `seed:false` (unlike
      its 7 machine_identity siblings), so seed.py clobbered Vault with a
      random secret on every `just up` that Keycloak then rejected, crashing
      this workload's startup self-check in a 290+-restart loop. test/prod
      still use WIF -> Entra instead (no stored secret; see ADR-006 §4).

  - name: commercial-normalization-agent-client-secret
    purpose: agent service-account credential (client-credentials flow, dev only)
    consumers: [commercial-normalization-agent]
    environments: [dev]
    owner: platform-team
    rotation: 90d
    vault_path: rfq/agents/commercial-normalization-agent-svc
    seed: false
    note: value comes from the commercial-normalization-agent-svc client
      Keycloak already provisions (infra/keycloak/terraform's
      machine_identities for_each) -- fetched live via the Keycloak admin API
      and recorded here, same posture as qms-mcp-svc-client-secret above;
      seed.py must not overwrite it with a random value. Found live -- missing
      `seed:false` here caused the same crash-loop as
      lane-evaluation-agent-client-secret above. test/prod use WIF -> Entra
      instead.

  - name: route-decision-agent-client-secret
    purpose: agent service-account credential (client-credentials flow, dev only)
    consumers: [route-decision-agent]
    environments: [dev]
    owner: platform-team
    rotation: 90d
    vault_path: rfq/agents/route-decision-agent-svc
    seed: false
    note: value comes from the route-decision-agent-svc client Keycloak
      already provisions (infra/keycloak/terraform's machine_identities
      for_each) -- fetched live via the Keycloak admin API and recorded here,
      same posture as qms-mcp-svc-client-secret above; seed.py must not
      overwrite it with a random value. Found live -- missing `seed:false`
      here caused the same crash-loop as lane-evaluation-agent-client-secret
      above. test/prod use WIF -> Entra instead.

  - name: trust-boundary-fixture-agent-client-secret
    purpose: M6a Integration Checkpoint 1's trust-boundary test fixture (identity/
      actors.yaml's agent.trust-boundary-fixture) -- not a business persona,
      exercises D10's trust_domain condition with a real Keycloak token.
    consumers: [trust-boundary-fixture-agent]
    environments: [dev]
    owner: platform-team
    rotation: 90d
    vault_path: rfq/agents/trust-boundary-fixture-agent-svc
    seed: false
    note: value comes from the trust-boundary-fixture-agent-svc client
      Keycloak already provisions (infra/keycloak/terraform's
      machine_identities for_each) -- fetched live via the Keycloak admin API
      and recorded here, same posture as qms-mcp-svc-client-secret above;
      seed.py must not overwrite it with a random value. Found live -- missing
      `seed:false` here caused the same crash-loop as
      lane-evaluation-agent-client-secret above. test/prod use WIF -> Entra
      instead.

  - name: mission-control-api-svc-client-secret
    purpose: workload.mission-control's own Keycloak confidential-client secret, used
      to authenticate ITS token-introspection calls (RFC 7662) when verifying an
      inbound caller's bearer token on /api/v1/* -- the resource server
      authenticates itself, distinct from the caller's own credential.
    consumers: [mission-control-api]
    environments: [dev]
    owner: platform-team
    rotation: 90d
    vault_path: rfq/mission-control-api-svc-client-secret
    seed: false
    note: value comes from the mission-control-api-svc client Keycloak already
      provisions (infra/keycloak/terraform's machine_identities for_each) --
      fetched live via the Keycloak admin API and recorded here, same posture
      as tms-mcp-svc-client-secret/rate-mcp-svc-client-secret/
      qms-mcp-svc-client-secret/approval-mcp-svc-client-secret above; seed.py
      must not overwrite it with a random value.

