  - name: rate-mcp-api-key
    purpose: MCP server -> Rate backend auth hop
    consumers: [rate-mcp]
    environments: [dev, test, prod]
    owner: platform-team
    rotation: 90d
    status: planned

  - name: commercial-mcp-api-key
    purpose: MCP server -> CPQ backend auth hop
    consumers: [commercial-mcp]
