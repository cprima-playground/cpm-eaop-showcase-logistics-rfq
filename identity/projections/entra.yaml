# Entra-specific projection. Two halves, both real:
#   - tenant_domain/app_registrations: PRE-apply input, consumed by
#     tools/identity/gen_entra.py (M3.3) to build Terraform input --
#     mirrors identity/projections/keycloak.yaml's naming-only shape.
#   - tenant_id/clients: POST-apply write-back, generated by THIS
#     script from infra/entra/'s already-applied Terraform state
#     (machine_identity_client_ids output). Client IDs only, never
#     secrets -- secrets stay in Vault. Mirrors keycloak.yaml's shape
#     so rfq_common.pep.resolve._client_id_maps() can merge both.
#   This script only ever rewrites tenant_id/clients -- the other
#   half is preserved from whatever was already in the file.

