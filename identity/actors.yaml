# Actors for the repricing subprocess — business actors + their principal identity.
#
# MIRRORS cpm-eaop identity conventions:
#   - department/business_unit are NOT inline on the actor; they derive from group
#     path -> cost_center (see data/identity/groups.yaml in cpm-eaop). Actors
#     reference group ids via member_of.
#   - principal kind vocab: human | service | agent | workload | external
#     (taxonomy enum spelling; note cpm-eaop Python uses `external_agent`).
#   - agent actors are classified `kind=agent` because their caller client id is in
#     the agent registry (agents/catalog.yaml caller_identity.keycloak_client).

actors:
  # --- Humans -----------------------------------------------------------
  # `id` stays unchanged from earlier fixtures on purpose -- it's a live
  # Cedar entity uid (Principal::"mona.commercial") asserted against by
  # src/rfq_common/tests/test_pdp_integration.py and referenced by several
  # scenarios/*.yaml + traceability.yaml + claims-contract.md; renaming it
  # would break real passing tests for no benefit. `name` is the new field
  # -- the full name the QMS frontend's org chart (systems/mock-
  # architecture.md) actually displays.
  - id: diane.delgado
    name: Diane Delgado
    kind: human
    persona: RegionalDirector
    region: EMEA
    # Oversees both EMEA teams below; not itself a Cedar-policy-gated role
    # today (no decision references a "director" principal yet).

  - id: mona.commercial
    name: Mona Caldwell
    kind: human
    persona: CommercialManager
    member_of: [rfq-commercial-emea]     # -> department/BU via group path
    manager: diane.delgado
    approval_limit:
      currency: EUR
      amount_cents: 1000000              # 10,000 EUR delegated commercial limit
    region: EMEA

  - id: sam.pricing
    name: Marek Petrov
    kind: human
    persona: PricingManager
    member_of: [rfq-pricing-emea]
    manager: diane.delgado
    region: EMEA

  - id: aiden.ashford
    name: Aiden Ashford
    kind: human
    persona: PlatformAdministrator
    region: EMEA
    # Not part of the commercial/pricing reporting line -- owns QMS's
    # /admin/reset action, no Cedar policy references this persona yet.

  # --- Agents (kind=agent; see agents/catalog.yaml) -------------------------
  - id: agent.lane-evaluation
    kind: agent
    persona: LaneEvaluationAgent
    trust_domain: internal
    keycloak_client: lane-evaluation-agent-svc

  - id: agent.commercial-normalization
    kind: agent
    persona: CommercialNormalizationAgent
    trust_domain: internal
    keycloak_client: commercial-normalization-agent-svc

  - id: agent.route-decision
    kind: agent
    persona: RouteDecisionAgent
    trust_domain: internal
    keycloak_client: route-decision-agent-svc

# Groups referenced above (mirror data/identity/groups.yaml path->cost_center shape).
# Full directory would live in identity/groups.yaml; sketched here for the slice.
groups:
  - {group_id: rfq-commercial-emea, path: /Front-Office/Commercial/EMEA, cost_center: CC-COMM-EMEA}
  - {group_id: rfq-pricing-emea,    path: /Back-Office/Pricing/EMEA,     cost_center: CC-PRIC-EMEA}
