# Actors for the repricing subprocess — business actors + their principal identity.
#
# MIRRORS cpm-eaop identity conventions:
#   - department/business_unit are NOT inline on the actor; they derive from group
#     path -> cost_center (see identity/groups.yaml). Actors reference group ids
#     via member_of.
#   - principal kind vocab (canonical, as of the M3.1 directory review):
#     human | agent | workload. `service` was a stale synonym for `workload`,
#     `external` an unimplemented future kind — both dropped from this
#     comment (and were never in the Identity Validator's accepted set,
#     tools/identity/validator.py's `Kind` literal) to stop the doc and the
#     code disagreeing. Add `external` back here only alongside real support
#     (a validator change + a Cedar entity type), not preemptively.
#   - agent actors are classified `kind=agent` because their caller client id is in
#     the agent registry (agents/catalog.yaml caller_identity.keycloak_client).
#   - workload actors (kind=workload, added M2) are MCP servers. They are raw,
#     IdP-neutral identity facts ONLY — id/kind/system/trust_domain. No
#     `keycloak_client` or any other provider-specific field: that's Keycloak/
#     Entra projection detail, introduced separately in M3.5's provider-
#     projection config, not an identity fact (implementation plan decision
#     #11).
#   - `system` values are canonical: they match the `src/mock-<system>/`
#     directory suffix (tms, rate, qms, fx, masterdata) — that directory
#     naming is the registry, not a free-form label.
#   - naming for genuinely new entries follows the settled convention:
#     `human.<name>` / `agent.<persona>` / `workload.<system>`. Pre-existing
#     bare ids (mona.commercial, sam.pricing, ...) are kept unchanged per the
#     note below — they are not retrofitted.
#   - `job_title_id` / `department_id` (organization-first directory review)
#     are STABLE REFERENCES into business/job-titles.yaml and business/
#     departments.yaml — not free text. `persona` stays as the pre-existing
#     internal architecture/Cedar-facing label, unchanged, so nothing that
#     reads it breaks; job_title_id is what a logistics professional would
#     recognize on an org chart, and the two intentionally don't always
#     line up word-for-word (e.g. persona=CommercialManager,
#     job_title_id=pricing-manager -- persona names which GROUP/authority
#     tier the actor belongs to, job_title_id names the real-world role).
#     tools/identity/validator.py cross-checks both ids exist.
#   - the organization is BUSINESS-COMPLETE (business/departments.yaml,
#     business/job-titles.yaml cover departments/titles this repricing
#     subprocess doesn't implement yet, e.g. Carrier Procurement) but
#     identity/actors.yaml stays IMPLEMENTATION-SCOPED -- a human is only
#     added here when there's a reason to (grounding an existing agent, or
#     -- per this session's explicit decision -- making the org chart
#     recognizable even one step ahead of the agent/API that would
#     eventually automate part of the role, as with Carrier Procurement
#     Specialist below).

