  # --- Workloads (kind=workload) ---------------------------------------
  # workload.* identifies non-human service principals, including MCP
  # servers, control-plane services, and other trusted runtime workloads
  # (widened M8 -- previously documented as "MCP servers" only, no
  # longer accurate once workload.mission-control exists). Raw identity
  # facts only -- see header comment. No member_of (no default group
  # membership; Cedar policy decides what a workload may do). `system`
  # is optional -- for an MCP server it names the mock-<system>/ it
  # wraps; a control-plane service has no such backing system and uses
  # a self-descriptive value instead (see workload.mission-control).
  - id: workload.tms-mcp
    kind: workload
    system: tms
    trust_domain: internal

  - id: workload.rate-mcp
    kind: workload
    system: rate
    trust_domain: internal

  - id: workload.qms-mcp
    kind: workload
    system: qms
    trust_domain: internal

  - id: workload.approval-mcp
    kind: workload
    system: qms                # shares mock-qms with qms-mcp; ADR-002 must
    trust_domain: internal     # verify their owned action sets stay disjoint

  - id: workload.mission-control
    kind: workload
    system: control-plane      # M8 -- observes, never a mock-* business system
    trust_domain: internal

  - id: workload.geo-api
    kind: workload
    system: geo                # M10 -- no mock-* backend; self-descriptive,
    trust_domain: internal     # same posture as workload.mission-control

  - id: workload.ops-dashboard
    kind: workload
    system: ops-dashboard      # M10 -- ops-dashboard's OWN service identity for
    trust_domain: internal     # outbound calls to bearer-token-protected peers
                                # (geo-api), distinct from ops-dashboard-web (the
                                # human-SSO Authorization Code client) -- a
                                # client_credentials-grant confidential client

  # --- Agents (kind=agent) ---------------------------------------------
  # keycloak_client removed (M3.1 directory review, decision #1): it was a
  # redundant copy of agents/catalog.yaml's caller_identity.keycloak_client,
  # which is the field identity resolution actually scans (catalog.yaml:4-5).
  # Each agent is a bounded SUBSET of a human persona's job -- see
  # business/personas.md for the persona -> owned_actions mapping and the
  # real job-description bullets each agent does/doesn't cover.
  - id: agent.lane-evaluation
    kind: agent
    persona: LaneEvaluationAgent
    trust_domain: internal

  - id: agent.commercial-normalization
    kind: agent
    persona: CommercialNormalizationAgent
    trust_domain: internal

  - id: agent.route-decision
    kind: agent
    persona: RouteDecisionAgent
    trust_domain: internal

  # M6a Integration Checkpoint 1 trust-boundary FIXTURE, not a business
  # persona: proves D10 (agent-may-check-capacity) actually denies a real,
  # validly-authenticated agent whose trust_domain is not "internal" --
  # exercised via a real Keycloak client-credentials token, same as the
  # 3 persona-backed agents above. owned_actions: [] deliberately (a
  # cross-trust-domain caller shouldn't own anything yet, not just
  # capacity.check) -- see agents/catalog.yaml's matching entry.
  - id: agent.trust-boundary-fixture
    kind: agent
    persona: null
    trust_domain: external

