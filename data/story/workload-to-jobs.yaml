schema_version: 1
generated_from:
- business/job-titles.yaml
- business/job-workload-mappings.yaml
- agents/catalog.yaml
- identity/actors.yaml
- identity/groups.yaml
- authorization/policies.cedar
- tools/story/generate_workload_map.py
note: 'Current scope: this projection covers selected responsibilities from the Transport
  Planner, Commercial Pricing Specialist, and Pricing Manager job descriptions within
  the cross-currency lane repricing and approval subprocess. It connects those responsibilities
  to the showcase''s implemented agent, MCP, system-API, and policy enforcement workloads,
  and includes the directory hierarchy used for AuthZ. It is not a claim that an entire
  job, role, or department is automated or replaced.'
directory:
  sources:
  - identity/actors.yaml
  - identity/groups.yaml
  - authorization/authz-projection.yaml
  identity_service_targets:
  - keycloak
  - entra_id
  hierarchy_relation: actor.member_of -> group.path -> policy principal in Group
  policy_relevant_groups:
  - rfq-commercial-emea
  groups:
  - group_id: rfq-commercial-emea
    path: /Front-Office/Commercial/EMEA
    cost_center: CC-COMM-EMEA
  - group_id: rfq-pricing-emea
    path: /Back-Office/Pricing/EMEA
    cost_center: CC-PRIC-EMEA
  - group_id: rfq-planning-emea
    path: /Front-Office/Planning/EMEA
    cost_center: CC-PLAN-EMEA
  - group_id: rfq-commercial-apac
    path: /Front-Office/Commercial/APAC
    cost_center: CC-COMM-APAC
  - group_id: rfq-pricing-apac
    path: /Back-Office/Pricing/APAC
    cost_center: CC-PRIC-APAC
  - group_id: rfq-planning-apac
    path: /Front-Office/Planning/APAC
    cost_center: CC-PLAN-APAC
  - group_id: rfq-commercial-amer
    path: /Front-Office/Commercial/AMER
    cost_center: CC-COMM-AMER
  - group_id: rfq-pricing-amer
    path: /Back-Office/Pricing/AMER
    cost_center: CC-PRIC-AMER
  - group_id: rfq-planning-amer
    path: /Front-Office/Planning/AMER
    cost_center: CC-PLAN-AMER
