# Agent catalog — repricing subprocess (three agents).
#
# MIRRORS cpm-eaop data/agents/hello-agent-*.yaml. The load-bearing field is
# `caller_identity.oidc_client_id` — identity resolution scans it, and any azp in
# that set resolves to kind=agent with a populated AgentIdentity (else kind=service).
# Provider-neutral name (was `keycloak_client`) -- the value is just a client_id
# string, meaningful for whichever OIDC provider issued the token (Keycloak
# today, Entra in test/prod -- see tmp/oidc-identity-unification-plan.md).
# `can_call` declares the allowed A2A edges (governed by agent.delegate).
#
# Fields beyond the cpm-eaop card (owned_actions, mcp_access, prohibited_actions,
# human_escalation) are documented SHOWCASE EXTENSIONS. platform/endpoint are TARGET
# (no real deployment in this pass).

agents:
  - id: lane-evaluation-agent
    name: Lane Evaluation Agent
    platform: TARGET                     # e.g. gcp-vertex-ai-agent-engine | uipath
    description: Build and compare valid route alternatives. Does NOT convert currency or approve deviations.
    endpoint: {TARGET: true}
    auth: {mechanism: oauth2-client-credentials}
    caller_identity:
      oidc_client_id: lane-evaluation-agent-svc
      audience_asserted: repricing-agent-api
      can_call: [commercial-normalization-agent]     # A2A handoff
    owned_actions: [lane.evaluate, lane.option.create, capacity.check, carrier-rate.read]
    mcp_access: [tms-mcp, rate-mcp]
    prohibited_actions: [route-cost.normalize, route-deviation.approve]
    human_escalation: [no_feasible_lane]
    source: {path: spikes/repricing/mock-agents/lane-evaluation}
    status: design

  - id: commercial-normalization-agent
    name: Commercial Normalization Agent
    platform: TARGET
    description: Turn heterogeneous route costs into commercially comparable options via FX normalization.
    endpoint: {TARGET: true}
    auth: {mechanism: oauth2-client-credentials}
    caller_identity:
      oidc_client_id: commercial-normalization-agent-svc
      audience_asserted: repricing-agent-api
      can_call: [route-decision-agent]
    owned_actions: [fx-rate.read, route-cost.normalize, quote-price.calculate, quote-variance.evaluate, quote.submit-for-approval]
    api_access: [fx-api]                 # direct HTTP, not MCP
    mcp_access: [qms-mcp]
    # Finding 1 (capability-profile review, business/capability-profiles/
    # offer-to-execution-domain-review.md): quote.submit-for-approval moved here
    # from route-decision-agent -- aligns with business/decisions.md's D4/D12
    # (2 of 3 entries already said CommercialNormalizationAgent; D5 corrected
    # to match, see decisions.md). Submitting the QuoteVersion this agent just
    # priced is a smaller conceptual leap than Planning's agent doing it, and
    # matches qms being the decision's system of record.
    # route-deviation.approve/quote.approve/quote.reject: the decision side
    # stays human-only (D6/D19/D20) -- this agent submits, it never decides.
    # Cedar's forbid-auto-replace-on-fx (D4b) still blocks the FX>2% submit
    # case unconditionally, regardless of this list.
    prohibited_actions: [route-deviation.approve, quote.approve, quote.reject]
    human_escalation: [fx_snapshot_stale]
    source: {path: spikes/repricing/mock-agents/commercial-normalization}
    status: design

  - id: route-decision-agent
    name: Route Decision Agent
    platform: TARGET
    description: Recommend a route (not approve it). Create a human review task when a threshold is crossed.
    endpoint: {TARGET: true}
    auth: {mechanism: oauth2-client-credentials}
    caller_identity:
      oidc_client_id: route-decision-agent-svc
      audience_asserted: repricing-agent-api
      # M5a: real A2A edge -- route-decision re-checks capacity via lane-
      # evaluation-agent's evaluate-lane-capacity skill before finalizing a
      # recommendation, rather than calling tms-mcp itself (that would be
      # MCP again, not A2A delegation).
      can_call: [lane-evaluation-agent]
    owned_actions: [route.recommend, route-deviation.propose]
    mcp_access: [approval-mcp]
    # Finding 1: quote.submit-for-approval moved to commercial-normalization-
    # agent (see its comment) -- this agent recommends routes, it doesn't
    # touch the Quote/qms domain at all anymore.
    # Finding 2: approval.request removed entirely, not reassigned -- per
    # capability-profile review, creating an ApprovalTask should be a system-
    # internal consequence of quote.submit-for-approval's QMS state
    # transition to approval_required, not an independently agent-commanded
    # action (avoids the QuoteVersion/ApprovalTask divergence risk: submitted-
    # but-no-task or task-but-never-submitted). mcp_access retains
    # approval-mcp for get_approval_status (read) and record_recommendation/
    # resume_route_decision (still-owned actions) -- create_approval_task's
    # MCP tool mapping needs reassignment when workflow's system-internal
    # trigger is actually implemented (out of this fix's scope).
    prohibited_actions: [route-deviation.approve, quote.submit-for-approval, quote.approve, quote.reject]   # recommends, never approves or submits
    human_escalation: [threshold_exceeded]
    source: {path: spikes/repricing/mock-agents/route-decision}
    status: design

  # M6a Integration Checkpoint 1 trust-boundary FIXTURE (identity/actors.yaml's
  # matching comment) -- not a business persona. Proves D10 denies a real,
  # validly-authenticated agent whose trust_domain != internal. Owns nothing.
  - id: trust-boundary-fixture-agent
    name: Trust Boundary Fixture Agent
    platform: TARGET
    description: Test/demo identity only -- exercises Cedar's trust_domain boundary for D10 (capacity.check). Not a modeled business role.
    endpoint: {TARGET: true}
    auth: {mechanism: oauth2-client-credentials}
    caller_identity:
      oidc_client_id: trust-boundary-fixture-agent-svc
      audience_asserted: repricing-agent-api
      can_call: []
    owned_actions: []
    mcp_access: []
    prohibited_actions: []
    human_escalation: []
    source: {path: N/A -- Cedar/identity test fixture, no mock-agent implementation}
    status: design

# Note: no agent "owns" the RFQ or Quote — it owns EXECUTION of an action; the
# business object stays owned by its system of record (systems/systems-of-record.yaml).
