# Authorization projection — the coupling firewall for the repricing subprocess.
#
# MIRRORS cpm-eaop data/policies/authz-projection.yaml. The declared view of which
# entity types + attributes + relations enter authorization. Rules:
#   - Only `member_of` becomes a Cedar PARENT (-> Group). Every other relationship
#     (department, trust_domain, region, contracted_lane, ...) is a typed ATTRIBUTE,
#     never a parent — so authorization never walks a huge parent graph.
#   - Attributes are sourced from the business model or from identity resolution.
#   - ACTIONS ARE NOT HERE — they belong to the authorization model (business/actions.yaml).
#   - This is the SMALLEST stable view needed to answer the decisions in
#     business/decisions.md. Adding an attribute here is a deliberate act.
#
# The Cedar schema (authorization/agentic.cedarschema) is GENERATED from this file +
# actions.yaml — never hand-edited.

namespace: Agentic

entities:
  # --- principals -----------------------------------------------------------
  Principal:                       # humans
    ontology: principal
    parents: [Group]               # via member_of
    attributes:
      kind: String
      active: Boolean
      department: {type: String, required: false}
      roles: {type: Set<String>, required: false}

  AgentPrincipal:                  # the three repricing agents
    ontology: agent_principal
    parents: [Group]
    attributes:
      kind: String
      active: Boolean
      trust_domain: {type: String, required: false}
      # canonical_id/can_call (M3.5, can_call projection deferred from
      # ADR-001/decision #10): Cedar has no native "compare to my own uid
      # string" or Set<Entity> support in this repo's schema generator
      # (tools/identity/../schema_gen.py's _cedar_type handles only
      # String/Boolean/Long + Set of those) -- can_call is modeled as a
      # Set<String> of callee canonical ids, compared against the callee's
      # own denormalized canonical_id attribute, not the entity uid itself.
      canonical_id: {type: String, required: false}
      can_call: {type: Set<String>, required: false}
      # delegatable_actions (M4a second checkpoint): the subset of this
      # agent's own owned_actions (agents/catalog.yaml) it may execute WHEN
      # acting under a human delegation (context.delegated_by). Currently
      # identical to owned_actions -- no narrower delegation scope than an
      # agent's own normal authority is modeled yet, but kept as a distinct
      # attribute (not reusing can_call, a different relationship) so a
      # future narrower delegation scope doesn't require a schema change.
      delegatable_actions: {type: Set<String>, required: false}

  Workload:                       # MCP servers (ADR-001) — no default group membership
    ontology: null
    attributes:
      kind: String
      active: Boolean
      system: String
      trust_domain: {type: String, required: false}

  Group:
    ontology: group

  # --- resources ------------------------------------------------------------
  RFQ:
    ontology: null                 # showcase business object, no ontology class
    attributes:
      region: {type: String, required: false}
      contracted_lane: {type: String, required: false}

  RouteOption:
    ontology: null
    attributes:
      lane_id: {type: String, required: false}
      capacity_status: {type: String, required: false}

  ExchangeRate:
    ontology: null
    attributes:
      pair: {type: String, required: false}
      source: {type: String, required: false}

  Quote:
    ontology: null
    attributes:
      status: {type: String, required: false}

  RouteRecommendation:
    ontology: null
    attributes:
      non_contracted_lane: {type: Boolean, required: false}
      quote_status: {type: String, required: false}   # M6 (approval-mcp): the referenced
        # QuoteVersion's live status, supplied per request via additional_entities
        # -- never pre-loaded into the persisted store. See
        # agent-may-record-route-deviation-when-draft (authorization/policies.cedar).

  ApprovalTask:
    ontology: null
    attributes:
      status: {type: String, required: false}
