      context: ..
      dockerfile: src/mock-fx/Dockerfile
      # Explicit local cache dir, independent of wherever Docker Desktop's
      # own VM disk lives -- point DOCKER_BUILDCACHE_DIR at a fast/large
      # drive (e.g. T:\docker-buildcache) if the default in-repo location
      # isn't right for this machine. mode=max on cache_to so uv sync's
      # dependency-download layer specifically gets cached, not just the
      # final layer.
      cache_from:
        - type=local,src=${DOCKER_BUILDCACHE_DIR:-.buildcache}/mock-fx
      cache_to:
        - type=local,dest=${DOCKER_BUILDCACHE_DIR:-.buildcache}/mock-fx,mode=max
    image: eaop-logistics-mock-fx
    environment:
      <<: [*vault-env, *otel-env]
      # Found live via M8.3's health check: without this, mock-fx falls
      # back to a broken default (http://localhost:8003, itself inside
      # its own container) and crash-loops on every currency lookup --
      # a real, pre-existing gap, not new to this milestone.
      MASTERDATA_URL: http://mock-masterdata:8003
    networks: [eaop-infra]
    restart: unless-stopped
    profiles: [core, full]

