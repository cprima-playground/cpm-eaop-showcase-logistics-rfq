# SHOWCASE stack -- the actual demo services: mock backends, MCP servers,
# A2A agents. Joins the SUPPORT stack's network (infra/compose.support.yaml)
# as external -- bring support up first, or `docker compose -f
# infra/compose.support.yaml -f infra/compose.showcase.yaml ... up` merges
# both into one project in a single command.
#
# GATEWAY-FIRST (tmp/caddy-first-routing-analysis.md): none of these publish a
# host port. Reachable only via the support stack's gateway (external,
# infra/compose/Caddyfile -- Caddy in dev, GCP Apigee is the TARGET for
# test/prod) or this network's own DNS (internal, peer-to-peer -- an agent
# calling an MCP server, or an MCP server calling its backend business
# system, addresses the other container by compose SERVICE NAME directly;
# the gateway is authoritative EXTERNAL ingress only, never an internal
# service-mesh hairpin).
#
# Profiles (pass more than one --profile flag to combine):
#   core           -- the 6 mock backends
#   mcp            -- + the 4 MCP servers (need `core` too, for their backend calls)
#   agents         -- + the 3 A2A agents (need `core`+`mcp` too, for their calls)
#   control-plane  -- + mission-control-api (M8, read-only; polls every
#                      service's own /descriptor -- no write ops, no
#                      dependency other than reaching its peers' /descriptor
#                      endpoints and cedar-agent's live policy list)
#   full           -- everything
#
# Run (support stack must already be up):
#   docker compose -f infra/compose.support.yaml -f infra/compose.showcase.yaml --profile core up -d --build
#
# One-time prerequisites (unchanged by this file): Vault seeded
# (infra/vault/README.md's `uv run seed.py`); Keycloak realm + client
# secrets provisioned (identity/ generators); hosts-file entries + Caddy CA
# trust for every *.rfq-showcase.localhost name (infra/caddy/README.md).
name: rfq-showcase-showcase

x-vault-env: &vault-env
  VAULT_ADDR: http://vault:8200

x-keycloak-env: &keycloak-env
  KEYCLOAK_BASE_URL: http://keycloak:8080

# cedar-agent (:8180 in-container / :8280 published) does NOT run from
# this compose project -- it's the long-lived isolated sidecar every
# real-stack test in this repo already points CEDAR_URL=http://
# localhost:8280 at (spikes/repricing/policy-evaluation's own
# docker-compose.yml, a separate checkout, run standalone). Never wired
# into the rfq-showcase network until this fix: every MCP-server/agent
# authorize_and_enforce() call in the live deployed stack was failing
# with httpx.ConnectError (found live, M7 stabilization pass) because
# neither this env var nor the network connection existed. Joined the
# already-running container to the rfq-showcase network directly
# (`docker network connect --alias cedar-agent rfq-showcase
# rfq-showcase-cedar-agent`) rather than touching its own compose file,
# which lives outside this repo's tree.
x-cedar-env: &cedar-env
  CEDAR_URL: http://cedar-agent:8180

networks:
  rfq-showcase:
    name: rfq-showcase
    external: true

services:
  # ------------------------------------------------------- mock backends
  mock-fx:
    build: {context: .., dockerfile: src/mock-fx/Dockerfile}
    image: rfq-showcase-mock-fx
    environment:
      <<: *vault-env
      # Found live via M8.3's health check: without this, mock-fx falls
      # back to a broken default (http://localhost:8003, itself inside
      # its own container) and crash-loops on every currency lookup --
      # a real, pre-existing gap, not new to this milestone.
      MASTERDATA_URL: http://mock-masterdata:8003
    networks: [rfq-showcase]
    restart: unless-stopped
    profiles: [core, full]

  mock-masterdata:
    build: {context: .., dockerfile: src/mock-masterdata/Dockerfile}
    image: rfq-showcase-mock-masterdata
    environment:
      <<: *vault-env
    networks: [rfq-showcase]
    restart: unless-stopped
    profiles: [core, full]

  mock-tms:
    build: {context: .., dockerfile: src/mock-tms/Dockerfile}
    image: rfq-showcase-mock-tms
    environment:
      <<: *vault-env
      MASTERDATA_URL: http://mock-masterdata:8003
    networks: [rfq-showcase]
    restart: unless-stopped
    profiles: [core, full]

  mock-rate:
    build: {context: .., dockerfile: src/mock-rate/Dockerfile}
    image: rfq-showcase-mock-rate
    environment:
      <<: *vault-env
      MASTERDATA_URL: http://mock-masterdata:8003
    networks: [rfq-showcase]
    restart: unless-stopped
    profiles: [core, full]

  mock-qms:
    build: {context: .., dockerfile: src/mock-qms/Dockerfile}
    image: rfq-showcase-mock-qms
    environment:
      <<: [*vault-env, *keycloak-env, *cedar-env]
      MASTERDATA_URL: http://mock-masterdata:8003
      FX_URL: http://mock-fx:8001
      RATE_URL: http://mock-rate:8005
      TMS_URL: http://mock-tms:8004
    networks: [rfq-showcase]
    restart: unless-stopped
    profiles: [core, full]

  ops-dashboard:
    build: {context: .., dockerfile: src/ops-dashboard/Dockerfile}
    image: rfq-showcase-ops-dashboard
    environment:
      <<: [*vault-env, *keycloak-env, *cedar-env]
      MASTERDATA_URL: http://mock-masterdata:8003
      FX_URL: http://mock-fx:8001
      RATE_URL: http://mock-rate:8005
      TMS_URL: http://mock-tms:8004
      QMS_URL: http://mock-qms:8007
      GATEWAY_HOST: gateway   # ops-dashboard's own gateway-fronted checks (_check_frontend etc.)
    networks: [rfq-showcase]
    restart: unless-stopped
    profiles: [core, full]

  # ------------------------------------------------------------- MCP servers
  tms-mcp:
    build: {context: .., dockerfile: src/tms-mcp/Dockerfile}
    image: rfq-showcase-tms-mcp
    environment:
      <<: [*vault-env, *keycloak-env, *cedar-env]
      TMS_URL: http://mock-tms:8004
      SERVICE_PUBLIC_URL: https://tms-mcp.rfq-showcase.localhost
    networks: [rfq-showcase]
    restart: unless-stopped
    profiles: [mcp, full]

  rate-mcp:
    build: {context: .., dockerfile: src/rate-mcp/Dockerfile}
    image: rfq-showcase-rate-mcp
    environment:
      <<: [*vault-env, *keycloak-env, *cedar-env]
      RATE_API_URL: http://mock-rate:8005
      SERVICE_PUBLIC_URL: https://rate-mcp.rfq-showcase.localhost
    networks: [rfq-showcase]
    restart: unless-stopped
    profiles: [mcp, full]

  qms-mcp:
    build: {context: .., dockerfile: src/qms-mcp/Dockerfile}
    image: rfq-showcase-qms-mcp
    environment:
      <<: [*vault-env, *keycloak-env, *cedar-env]
      QMS_API_URL: http://mock-qms:8007
      FX_API_URL: http://mock-fx:8001
      SERVICE_PUBLIC_URL: https://qms-mcp.rfq-showcase.localhost
    networks: [rfq-showcase]
    restart: unless-stopped
    profiles: [mcp, full]

  approval-mcp:
    build: {context: .., dockerfile: src/approval-mcp/Dockerfile}
    image: rfq-showcase-approval-mcp
    environment:
      <<: [*vault-env, *keycloak-env, *cedar-env]
      QMS_API_URL: http://mock-qms:8007
      SERVICE_PUBLIC_URL: https://approval-mcp.rfq-showcase.localhost
    networks: [rfq-showcase]
    restart: unless-stopped
    profiles: [mcp, full]

  # ------------------------------------------------------------- A2A agents
  lane-evaluation-agent:
    build: {context: .., dockerfile: src/lane-evaluation-agent/Dockerfile}
    image: rfq-showcase-lane-evaluation-agent
    environment:
      <<: [*vault-env, *keycloak-env, *cedar-env]
      TMS_MCP_URL: http://tms-mcp:8104
      SERVICE_PUBLIC_URL: https://lane-evaluation-agent.rfq-showcase.localhost
    networks: [rfq-showcase]
    restart: unless-stopped
    profiles: [agents, full]

  route-decision-agent:
    build: {context: .., dockerfile: src/route-decision-agent/Dockerfile}
    image: rfq-showcase-route-decision-agent
    environment:
      <<: [*vault-env, *keycloak-env, *cedar-env]
      LANE_EVAL_AGENT_URL: http://lane-evaluation-agent:8204
      SERVICE_PUBLIC_URL: https://route-decision-agent.rfq-showcase.localhost
    networks: [rfq-showcase]
    restart: unless-stopped
    profiles: [agents, full]

  commercial-normalization-agent:
    build: {context: .., dockerfile: src/commercial-normalization-agent/Dockerfile}
    image: rfq-showcase-commercial-normalization-agent
    environment:
      <<: [*vault-env, *keycloak-env, *cedar-env]
      ROUTE_DECISION_AGENT_URL: http://route-decision-agent:8205
      SERVICE_PUBLIC_URL: https://commercial-normalization-agent.rfq-showcase.localhost
    networks: [rfq-showcase]
    restart: unless-stopped
    profiles: [agents, full]

  # --------------------------------------------------------- control plane
  mission-control-api:
    build: {context: .., dockerfile: src/mission-control-api/Dockerfile}
    image: rfq-showcase-mission-control-api
    environment:
      <<: [*vault-env, *keycloak-env, *cedar-env]
      SERVICE_PUBLIC_URL: https://mission-control.rfq-showcase.localhost
      # Registry roster (M8.2) -- the ONE place in this repo that
      # legitimately resolves every peer service's endpoint (ADR-002: no
      # other agent/MCP server gets a registry of every other service).
      LANE_EVALUATION_AGENT_URL: http://lane-evaluation-agent:8204
      ROUTE_DECISION_AGENT_URL: http://route-decision-agent:8205
      COMMERCIAL_NORMALIZATION_AGENT_URL: http://commercial-normalization-agent:8206
      TMS_MCP_URL: http://tms-mcp:8104
      RATE_MCP_URL: http://rate-mcp:8105
      QMS_MCP_URL: http://qms-mcp:8106
      APPROVAL_MCP_URL: http://approval-mcp:8107
      # Health-target roster only (M8.3) -- mission-control-api never
      # holds these systems' API keys, only checks /healthz reachability.
      MASTERDATA_URL: http://mock-masterdata:8003
      TMS_URL: http://mock-tms:8004
      RATE_URL: http://mock-rate:8005
      FX_URL: http://mock-fx:8001
      QMS_URL: http://mock-qms:8007
      # M8.6: Tempo lives in infra/observability/'s OWN compose project
      # (separate network, deliberately -- see compose.support.yaml's own
      # header comment). Same gap class as cedar-agent (M7 stabilization):
      # joined the running tempo container to this network directly
      # (`docker network connect --alias tempo rfq-showcase
      # rfq-showcase-otel-tempo-1`) rather than merging the two compose
      # projects. Real, separate, unresolved finding (traces.py's own
      # module docstring): every OTHER showcase service still has no
      # OTLP wiring to the collector at all -- this only fixes Mission
      # Control's own read path to Tempo, not the write path from every
      # other service.
      TEMPO_URL: http://tempo:3200
    networks: [rfq-showcase]
    restart: unless-stopped
    profiles: [control-plane, full]
