# SKETCH — local topology for the whole showcase (documentation, not runnable yet).
# One network; discovery by service name. Profiles bring up subsets. Determinism via
# NOW/SEED env on every container. Mirrors cpm-eaop infra/{cedar-agent,keycloak,caddy}.
name: rfq-showcase

x-determinism: &determinism           # injected into every service for reproducible runs
  NOW: "2026-07-24T09:00:00Z"         # pinned clock — load-bearing for FX freshness (D1/D2)
  SEED: "42"

x-oidc: &oidc
  OIDC_ISSUER: "http://keycloak:8080/realms/rfq"

services:
  # --- control plane -------------------------------------------------------
  cedar-agent:                         # upstream image; in-memory, reloaded via bootstrap
    image: permitio/cedar-agent
    ports: ["8180:8180"]
    profiles: [core, full]
  control-plane:
    image: rfq/control-plane
    environment: [*oidc, CEDAR_AGENT_URL=http://cedar-agent:8180]
    depends_on: [cedar-agent]
    profiles: [core, full]

  # --- identity ------------------------------------------------------------
  keycloak:
    image: quay.io/keycloak/keycloak
    command: start-dev --import-realm
    ports: ["8080:8080"]
    profiles: [sso, full]

  # --- mock systems (backend + API + SSR frontend; CLI = same image) -------
  crm:      {image: rfq/crm,      environment: [*determinism, *oidc], profiles: [core, full]}
  tms:      {image: rfq/tms,      environment: [*determinism, *oidc], profiles: [core, full]}
  rate:     {image: rfq/rate,     environment: [*determinism, *oidc], profiles: [core, full]}
  qms:      {image: rfq/qms,      environment: [*determinism, *oidc], profiles: [core, full]}   # approval UI
  fx:       {image: rfq/fx,       environment: [*determinism],         profiles: [core, full]}   # APIKEY, no SSO
  workflow: {image: rfq/workflow, environment: [*determinism, *oidc], profiles: [core, full]}

  # --- MCP servers (governed edges; APIKEY server->backend) ----------------
  crm-mcp:        {image: rfq/crm-mcp,        depends_on: [crm],      profiles: [full]}
  tms-mcp:        {image: rfq/tms-mcp,        depends_on: [tms],      profiles: [full]}
  rate-mcp:       {image: rfq/rate-mcp,       depends_on: [rate],     profiles: [full]}
  qms-mcp: {image: rfq/qms-mcp, depends_on: [qms],      profiles: [full]}
  approval-mcp:   {image: rfq/approval-mcp,   depends_on: [workflow], profiles: [full]}

  # --- agents (A2A chain: lane -> commercial -> route) ---------------------
  lane-agent:       {image: rfq/lane-agent,       environment: [*oidc], profiles: [agents, full]}
  commercial-agent: {image: rfq/commercial-agent, environment: [*oidc], profiles: [agents, full]}
  route-agent:      {image: rfq/route-agent,      environment: [*oidc], profiles: [agents, full]}

  # --- edge / PEP: Caddy locally (Apigee on GCP) ---------------------------
  edge:
    image: caddy
    ports: ["443:443", "80:80"]
    volumes: ["./Caddyfile:/etc/caddy/Caddyfile:ro"]   # per-system *.localhost + local HTTPS (SSO redirects)
    profiles: [core, full]                              # edge is useful even in core

# `just up core`  -> systems + PDP;  `just up full` -> everything.
# Scenario applied at runtime: `rfq scenario apply combined-route-and-fx-shock`.
