# Dev tool: A2A protocol inspector (vendored fork, vendor/a2aproject/a2a-inspector,
# git submodule -- see .gitmodules). Same per-service standalone-runnable
# convention as infra/keycloak, infra/vault. Not part of the showcase's own
# systems (see infra/compose.sketch.yaml) -- this is a debugging aid for
# whichever A2A agents/MCP servers land next, not a showcase dependency.
name: rfq-showcase-a2a-inspector
services:
  a2a-inspector:
    build:
      context: ../../vendor/a2aproject/a2a-inspector
      dockerfile: Dockerfile
    image: rfq-showcase-a2a-inspector
    container_name: rfq-showcase-a2a-inspector
    ports:
      - "8092:8080"
    restart: unless-stopped
