# SUPPORT stack -- platform dependencies the showcase runs on top of, not
# the showcase itself: gateway (edge -- Caddy in dev, GCP Apigee is the
# TARGET for test/prod, same env-conditional-facade shape as
# rfq_common.secrets.SecretsClient's Vault-dev/GCP-Secret-Manager-TARGET
# split), Keycloak (identity), Vault (secrets). Owns the shared
# `eaop-infra` network; infra/compose.showcase.yaml joins it as
# `external: true`. Separable from the showcase on purpose: you can bring
# support up/down independently (it changes rarely), and restart the
# showcase app layer without touching identity/secrets state.
#
# GATEWAY-FIRST (tmp/caddy-first-routing-analysis.md): the gateway is the
# sole externally-published ingress (443). Keycloak/Vault publish host ports
# too, but as an explicitly justified carve-out (admin console / seed script /
# debug access), not because peer services need them that way -- every
# showcase service reaches these by compose DNS (http://keycloak:8080,
# http://vault:8200), never through the gateway or a host-published port.
#
# Use the justfile (`just up` / `just down` / `just ps`), not a hand-rolled
# docker compose command -- a raw two-step "up support, then up support+showcase
# merged" command has no way to pin project identity consistently across both
# steps (Compose's top-level `name:` merge rule is "last file wins", so the
# merged step silently runs under compose.showcase.yaml's project name unless
# `-p` is given explicitly). Found live: this exact gap recreated
# gateway/keycloak/vault a second time under the wrong project, both trying
# to bind host port 443. The justfile's `up` recipe does two separate
# invocations, each with its own explicit `-p`, avoiding this entirely.
#
# infra/observability/ (OTel/Grafana/Prometheus/Tempo stack) is separate
# again, independently bootable -- also "support", but not merged into this
# file (different lifecycle, different owner this session).
name: eaop-infra

networks:
  eaop-infra:
    name: eaop-infra

volumes:
  # Explicit name -- otherwise Compose prefixes with the project name, and a
  # project rename (or invocation-directory drift, same root cause) silently
  # orphans the old volume and starts a fresh empty one. Bit us live: gateway
  # generated a brand-new root CA on an orphaned caddy-data volume after the
  # rfq-showcase-support -> eaop-support rename, breaking every browser's
  # existing trust of the old CA.
  # external: true -- these already exist (created once during the migration
  # off the orphaned volumes) and must NOT be recreated/relabeled by whatever
  # project happens to run `up` next; that's the whole point of pinning the
  # name. Without external: true, Compose still tries to "own" them and
  # warns every run ("already exists but was not created by Docker Compose")
  # since their creation-time labels don't match the current project --
  # found live. First-time bootstrap on a machine that's never had these:
  # `docker volume create eaop-keycloak-data; docker volume create eaop-caddy-data`
  # once, before the first `up`.
  keycloak-data:
    name: eaop-keycloak-data
    external: true
  caddy-data:
    name: eaop-caddy-data
    external: true

services:
  gateway:
    build:
      context: ./caddy
      dockerfile: Dockerfile
    image: eaop-infra-gateway
    ports:
      - "443:443"
    volumes:
      - ./compose/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
    networks:
      eaop-infra:
        # Every *.eaop-logistics.localhost vhost this proxies (infra/compose/
        # Caddyfile), registered as DNS aliases for this container -- lets
        # ANY peer on this network (a2a-inspector included) resolve and
        # reach these hostnames via compose-internal DNS, the same names +
        # real HTTPS + CA a browser gets, without editing /etc/hosts inside
        # every container that needs one. Docker's embedded resolver
        # doesn't special-case the .localhost TLD the way browsers do
        # (confirmed directly -- see infra/caddy/README.md), so without
        # this, only the HOST machine's hosts-file trick makes these names
        # resolve; any container-side client (this compose network's own
        # dev tooling) needs them registered explicitly instead.
        aliases:
          - ops-dashboard.eaop-logistics.localhost
          - qms.eaop-logistics.localhost
          - tms.eaop-logistics.localhost
          - rate.eaop-logistics.localhost
          - fx.eaop-logistics.localhost
          - masterdata.eaop-logistics.localhost
          - keycloak.eaop-logistics.localhost
          - lane-evaluation-agent.eaop-logistics.localhost
          - route-decision-agent.eaop-logistics.localhost
          - commercial-normalization-agent.eaop-logistics.localhost
          - tms-mcp.eaop-logistics.localhost
          - rate-mcp.eaop-logistics.localhost
          - qms-mcp.eaop-logistics.localhost
          - approval-mcp.eaop-logistics.localhost
          - mission-control.eaop-logistics.localhost
          - a2a-inspector.eaop-logistics.localhost
          - mcp-inspector.eaop-logistics.localhost
          - mcp-inspector-proxy.eaop-logistics.localhost
          - web.eaop-logistics.localhost
    restart: unless-stopped

  keycloak:
    build:
      context: ./keycloak
      dockerfile: Dockerfile
    image: eaop-infra-keycloak
    command: start-dev
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: rfq-dev-admin
      KC_PROXY_HEADERS: xforwarded
      # Fixed issuer regardless of request path -- without this, a token
      # minted via Caddy/:8081 (external Host) carries a different `iss`
      # than what an MCP server's internal http://keycloak:8080 call
      # computes for itself, so introspection sees active:false for a
      # genuinely valid token. Confirmed by direct reproduction (M7
      # re-auth work): external introspection said active:true, tms-mcp's
      # own internal introspection of the identical token said false.
      KC_HOSTNAME: https://keycloak.eaop-logistics.localhost
    ports:
      # Host side overridable (.env.example) for a dev whose 8081 is already
      # taken; container side stays fixed -- never collides (own network
      # namespace), no reason to make it configurable.
      - "${KEYCLOAK_HOST_PORT:-8081}:8080"   # carve-out: admin console direct access
    volumes:
      - keycloak-data:/opt/keycloak/data
    networks: [eaop-infra]
    restart: unless-stopped

  vault:
    image: hashicorp/vault:latest
    ports:
      - "${VAULT_HOST_PORT:-8200}:8200"   # carve-out: seed script / debug access
    environment:
      VAULT_DEV_ROOT_TOKEN_ID: rfq-dev-root
      VAULT_DEV_LISTEN_ADDRESS: 0.0.0.0:8200
    cap_add: [IPC_LOCK]
    networks: [eaop-infra]
    restart: unless-stopped

  # ---------------------------------------------------------- dev tooling
  # First-class members of this stack (not a standalone opt-in compose
  # project anymore -- infra/a2a-inspector/docker-compose.yml is superseded
  # by this block): on the SAME eaop-infra network as everything they
  # inspect, so they resolve gateway's *.eaop-logistics.localhost aliases
  # (above) via compose DNS and can reach every agent/MCP server directly,
  # the same way a real external client does. Gateway-routed, not a host-port
  # carve-out (unlike Keycloak/Vault's admin consoles) -- a peer dev surface
  # you browse routinely belongs behind https://a2a-inspector.rfq-showcase.
  # localhost (infra/compose/Caddyfile), same as any other showcase service.
  a2a-inspector:
    build:
      context: ./a2a-inspector
      dockerfile: Dockerfile
      # Not a submodule -- infra/a2a-inspector/Dockerfile clones
      # cprima-forks/a2aproject-a2a-inspector directly at build time. Never
      # the upstream a2aproject/a2a-inspector repo.
      args:
        A2A_INSPECTOR_REF: fix/streaming-false-0.3.10
      cache_from:
        - type=local,src=${DOCKER_BUILDCACHE_DIR:-.buildcache}/a2a-inspector
      cache_to:
        - type=local,dest=${DOCKER_BUILDCACHE_DIR:-.buildcache}/a2a-inspector,mode=max
      # source stage now caches like everything else -- fork checkout is
      # pinned to A2A_INSPECTOR_REF above, so "fresh every build" bought
      # nothing but a slow rebuild (npm/vite redone from scratch each time,
      # see build-cache explanation in conversation). Pick up a new fork
      # commit with `docker compose build --no-cache a2a-inspector`, or bump
      # A2A_INSPECTOR_REF for a real ref change.
    image: eaop-infra-a2a-inspector
    volumes:
      - ./caddy/root.crt:/usr/local/share/ca-certificates/gateway-root.crt:ro
    # Appends the gateway's local CA onto the image's own bundle into a
    # combined file (not a replacement -- SSL_CERT_FILE pointed at ONLY the
    # gateway cert broke the image's own startup; confirmed live,
    # `UnknownIssuer` against pypi.org). Plain concatenation, not
    # `update-ca-certificates` -- that hung indefinitely in this minimal
    # image for unclear reasons; confirmed via direct exec, still hung past
    # 30s. Runs the venv's own python directly instead of `uv run` -- the
    # vendored submodule's uv.lock is genuinely out of sync with its
    # pyproject.toml ("Missing workspace member `a2a-inspector`", confirmed
    # via `--frozen`), which makes plain `uv run` try to self-heal over the
    # network on every boot (that's what needed pypi.org above, and what was
    # hanging). The build-time `uv sync` already produced a working venv;
    # invoking it directly skips uv's runtime lock-check entirely, no
    # network dependency left at boot -- not a fix for the vendored repo's
    # own lockfile drift, just not depending on it.
    command: >
      sh -c "cat /etc/ssl/certs/ca-certificates.crt /usr/local/share/ca-certificates/gateway-root.crt > /tmp/combined-ca.pem &&
      cd /app/backend &&
      SSL_CERT_FILE=/tmp/combined-ca.pem /app/.venv/bin/python -m uvicorn app:app --host 0.0.0.0 --port 8080"
    networks: [eaop-infra]
    restart: unless-stopped

  mcp-inspector:
    build:
      context: ./mcp-inspector
      dockerfile: Dockerfile
      # Not a submodule -- infra/mcp-inspector/Dockerfile clones
      # cprima-forks/modelcontextprotocol-inspector directly at build time.
      # Never the upstream modelcontextprotocol/inspector repo.
      cache_from:
        - type=local,src=${DOCKER_BUILDCACHE_DIR:-.buildcache}/mcp-inspector
      cache_to:
        - type=local,dest=${DOCKER_BUILDCACHE_DIR:-.buildcache}/mcp-inspector,mode=max
      # source stage now caches like everything else (mirrors a2a-inspector
      # above). Dockerfile defaults MCP_INSPECTOR_REF to `main`, so a cached
      # build can silently sit on a stale commit -- pick up a new one with
      # `docker compose build --no-cache mcp-inspector`.
    image: eaop-infra-mcp-inspector
    environment:
      HOST: "0.0.0.0"   # image default is `localhost` -- unreachable from Caddy's own network hop
      ALLOWED_ORIGINS: https://mcp-inspector.eaop-logistics.localhost
      # DNS-rebinding origin check + per-session proxy token are real
      # protections (server/src/index.ts) but this instance is local-only,
      # gateway+CA-fronted, never internet-reachable -- same dev-convenience
      # tradeoff as Vault's fixed dev root token (infra/vault/README.md).
      # TARGET (test/prod) would need this on properly.
      DANGEROUSLY_OMIT_AUTH: "true"
    networks: [eaop-infra]
    restart: unless-stopped

  # Local stand-in for GitHub Pages (web/slides/ -- this repo's showcase
  # presentation materials): plain static file server, no build step of its
  # own. Gateway-routed like everything else in this stack, not a raw
  # host-published port.
  web:
    image: nginx:alpine
    volumes:
      - ../web:/usr/share/nginx/html:ro
    networks: [eaop-infra]
    restart: unless-stopped
