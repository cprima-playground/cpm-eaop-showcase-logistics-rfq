# Draft contract for the COMPLETE QMS boundary (superseded the earlier
# "narrow vertical slice" framing on purpose -- see git history for that
# version if the contrast is useful). Still design-stage, authored before the
# Pydantic models/Cedar policies it implies (spec-first, per this project's
# method -- same relationship fx.openapi.yaml has to mock-fx), and still
# using x-gap/x-owner/x-role annotations to surface unresolved questions
# rather than inventing answers for them.
#
# A REAL DISCOVERY THIS PASS: D16's own wording is "may the commercial agent
# create a quote version FROM THIS RECOMMENDATION" -- that only makes sense
# once recommendation_id is actually known, which under this draft-first flow
# happens via PUT .../route-recommendation, BEFORE pricing. So D16 now
# belongs at POST .../price (where recommendation_id is finally in hand and
# R1-R6 actually run), not at draft creation. D17 (supersede) stays at
# POST .../versions -- it doesn't need pricing content, just
# prior_version/trigger_event/current_status. This is a direct consequence
# of moving off the old atomic-creation model, not a stylistic choice.
openapi: 3.1.0
info:
  title: Quote Management System
  version: 0.2.0-draft
  description: >
    Draft contract for the complete QMS boundary. The contract intentionally
    includes unresolved lifecycle and ownership questions through x-gap
    annotations so implementation friction can refine the domain, rather
    than guessing now and re-deriving Pydantic models/Cedar policies later.
servers:
  - url: https://qms.localhost
security:
  - apiKey: []
tags:
  - name: Quotes
  - name: Draft Composition
  - name: Pricing
  - name: Approvals
  - name: Revisions
  - name: Publication
  - name: Customer Response
  - name: Documents
  - name: Validity
  - name: Pricing Configuration
  - name: Audit

paths:
  # ---------------------------------------------------------------- Quotes
  /quotes:
    get:
      tags: [Quotes]
      operationId: searchQuotes
      summary: Operational search/list, not generic database search.
      x-domain-action: quote.read   # x-gap, see /quotes/{quoteId}
      x-resource-type: Quote
      parameters:
        - {name: customerId, in: query, required: false, schema: {type: string}}
        - {name: rfqId,      in: query, required: false, schema: {type: string}}
        - {name: status,     in: query, required: false, schema: {type: string}}
        - {name: validAt,    in: query, required: false, schema: {type: string, format: date-time}}
      responses:
        "200":
          description: Matching quotes (aggregate view, not versions).
          content:
            application/json:
              schema: {type: array, items: {$ref: "#/components/schemas/Quote"}}
    post:
      tags: [Quotes]
      operationId: createQuote
      summary: Create the quote aggregate and its first version, as a real persisted draft.
      x-domain-action: quote.draft-create   # NOT D16 -- see x-gap
      x-resource-type: Quote
      x-consults:
        - service: masterdata
          endpoint: "GET /parties/{code}"
          purpose: "validate customer_id is a known, active Party (ADR-010) before opening a case against it"
      x-gap: >
        D16 requires recommendation_id (see file header note) -- not known
        yet at this point, since nothing has been composed. This command
        therefore needs ITS OWN decision, not D16: something like "may this
        principal open a new quote for this RFQ/customer at all." Low-stakes
        (nothing priced, nothing committed) but still a real gate -- an
        agent shouldn't be able to spray empty draft quotes against an RFQ
        it has no assignment to. Not modeled in decisions.md yet.
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/CreateQuoteRequest"}
      responses:
        "201":
          description: Quote aggregate + v1, status=draft.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/QuoteVersion"}

  /quotes/{quoteId}:
    get:
      tags: [Quotes]
      operationId: getQuote
      summary: The quote aggregate (identity + customer/RFQ linkage, not commercial content).
      x-domain-action: quote.read   # x-gap, see below
      x-resource-type: Quote
      x-gap: >
        No decision governs reading a quote at all today (this applies to
        every GET in this file marked quote.read) -- distinct from D18,
        which governs disclosing buy-cost details specifically. Likely needs
        field-level filtering (internal vs. customer-facing view, see
        GET .../customer-view) rather than one read/no-read boolean.
      parameters:
        - {name: quoteId, in: path, required: true, schema: {type: string}}
      responses:
        "200":
          description: The quote aggregate.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Quote"}
        "404": {description: No such quote.}

  /quotes/{quoteId}/versions:
    get:
      tags: [Quotes]
      operationId: listQuoteVersions
      summary: Every version of a quote, oldest first (the full revision history).
      x-domain-action: quote.read
      x-resource-type: Quote
      parameters:
        - {name: quoteId, in: path, required: true, schema: {type: string}}
      responses:
        "200":
          description: All versions.
          content:
            application/json:
              schema: {type: array, items: {$ref: "#/components/schemas/QuoteVersion"}}
    post:
      tags: [Quotes, Revisions]
      operationId: createNextQuoteVersion
      summary: Create the NEXT version (v2+) as a new draft, superseding an existing one.
      x-domain-action: quote.supersede   # -> D17. NOT D16 -- see file header note.
      x-resource-type: Quote
      x-authz-context:
        - quote_id
        - current_version
        - current_status
        - prior_version
        - trigger_event
      x-gap: >
        Concurrency: two agents racing to supersede the same quote must not
        both succeed. `expected_latest_version` is the precondition
        (equivalent to If-Match) -- a mismatch is a lost race (409), not an
        authorization failure (403); conflating the two would make a retry
        loop look forbidden when it's actually just stale.
      description: >
        D17 only (not D16 -- this creates an empty-ish draft, no
        recommendation resolved yet; D16 applies later at POST .../price for
        THIS new version). `copy_from_prior` controls which composed fields
        (shipment, commercial-terms, etc.) carry forward vs. must be
        re-supplied.
      parameters:
        - {name: quoteId, in: path, required: true, schema: {type: string}}
        - {name: Idempotency-Key, in: header, required: true, schema: {type: string, format: uuid}}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/CreateNextVersionRequest"}
      responses:
        "201":
          description: New quote version, status=draft, prior_version set.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/QuoteVersion"}
        "403": {description: "D17 denied -- no version written."}
        "409": {description: "expected_latest_version didn't match -- another caller already superseded it."}

  /quotes/{quoteId}/versions/{version}:
    get:
      tags: [Quotes]
      operationId: getQuoteVersion
      summary: Read one specific, immutable quote version (internal representation).
      x-domain-action: quote.read
      x-resource-type: Quote
      parameters:
        - {name: quoteId, in: path, required: true, schema: {type: string}}
        - {name: version, in: path, required: true, schema: {type: integer}}
      responses:
        "200":
          description: The quote version.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/QuoteVersion"}
        "404": {description: No such quote/version.}

  /quotes/{quoteId}/versions/{version}/revise:
    post:
      tags: [Revisions]
      operationId: markVersionForRevision
      summary: Flip THIS version's status to `revise` -- distinct from creating v2+.
      x-gap: >
        This is the human decision's "revise" outcome, expressed as its own
        endpoint per the user's request ("distinguish revise-the-status from
        create-the-next-version") -- but decisions.md's D6/D19-candidate
        already covers the decision itself (POST .../decisions with
        decision="revise" below does the same thing). Two endpoints for one
        transition is a real duplication risk this draft is surfacing, not
        resolving: pick one path before implementing, most likely folding
        this into POST .../decisions and removing this endpoint.
      parameters:
        - {name: quoteId, in: path, required: true, schema: {type: string}}
        - {name: version, in: path, required: true, schema: {type: integer}}
      responses:
        "200":
          description: status=revise (does not create a new version -- see POST .../versions).
          content:
            application/json:
              schema: {$ref: "#/components/schemas/QuoteVersion"}

  /quotes/{quoteId}/changes:
  # x-gap: overlaps /quotes/{quoteId}/timeline and /audit-events below --
  # three endpoints proposed for similar "what changed" questions. Kept
  # distinct here (changes = diffs between versions; timeline = status
  # transitions; audit-events = every authz-relevant action) but this is a
  # candidate for collapsing once real usage shows which views are actually
  # needed.
    get:
      tags: [Audit]
      operationId: listQuoteChanges
      summary: Diffs between consecutive versions of a quote.
      x-domain-action: quote.read
      x-resource-type: Quote
      parameters:
        - {name: quoteId, in: path, required: true, schema: {type: string}}
      responses:
        "200":
          description: Version-to-version diffs.
          content:
            application/json:
              schema: {type: array, items: {$ref: "#/components/schemas/ChangeEvent"}}

  /quotes/{quoteId}/versions/{version}/changes:
    get:
      tags: [Audit]
      operationId: listVersionChanges
      summary: What changed to produce THIS version from its prior_version.
      x-domain-action: quote.read
      x-resource-type: Quote
      parameters:
        - {name: quoteId, in: path, required: true, schema: {type: string}}
        - {name: version, in: path, required: true, schema: {type: integer}}
      responses:
        "200":
          description: Fields changed vs. prior_version.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/ChangeEvent"}

  /quotes/{quoteId}/timeline:
    get:
      tags: [Audit]
      operationId: getQuoteTimeline
      summary: Status transitions across every version, in order.
      x-domain-action: quote.read
      x-resource-type: Quote
      parameters:
        - {name: quoteId, in: path, required: true, schema: {type: string}}
      responses:
        "200":
          description: Ordered status-transition timeline.
          content:
            application/json:
              schema: {type: array, items: {$ref: "#/components/schemas/TimelineEntry"}}

  /quotes/{quoteId}/audit-events:
    get:
      tags: [Audit]
      operationId: listQuoteAuditEvents
      summary: Every authorization-relevant action taken against this quote.
      x-domain-action: quote.read   # x-gap: probably needs its own quote.audit-read, narrower than general read
      x-resource-type: Quote
      parameters:
        - {name: quoteId, in: path, required: true, schema: {type: string}}
      responses:
        "200":
          description: Audit events (one per Cedar-gated action taken).
          content:
            application/json:
              schema: {type: array, items: {$ref: "#/components/schemas/AuditEvent"}}

  /quotes/requiring-action:
    get:
      tags: [Quotes]
      operationId: listQuotesRequiringAction
      summary: Operational view -- quotes sitting in approval_required, or expiring soon.
      x-domain-action: quote.read
      x-resource-type: Quote
      responses:
        "200":
          description: Quotes needing attention.
          content:
            application/json:
              schema: {type: array, items: {$ref: "#/components/schemas/Quote"}}

  /quotes/expiring:
    get:
      tags: [Validity]
      operationId: listExpiringQuotes
      summary: Quotes approaching valid_until.
      x-domain-action: quote.read
      x-resource-type: Quote
      parameters:
        - {name: withinDays, in: query, required: false, schema: {type: integer, default: 7}}
      responses:
        "200":
          description: Quotes expiring within the window.
          content:
            application/json:
              schema: {type: array, items: {$ref: "#/components/schemas/Quote"}}

  # ------------------------------------------------------ Draft composition
  # x-gap (applies to every endpoint in this section): no decision in
  # decisions.md governs composing a draft's fields. All seven below likely
  # fold under one `quote.compose-draft` action -- or split per component if
  # a scoping distinction ever matters (e.g. an agent that may select a
  # route but not set commercial terms). Not designed here; each endpoint
  # below is a placeholder for the fields that section actually needs, most
  # of which (shipment/commercial-terms/assumptions/exclusions) are
  # genuinely undesigned, not just under-documented.

  /quotes/{quoteId}/versions/{version}/shipment:
    put:
      tags: [Draft Composition]
      operationId: putQuoteShipment
      summary: Shipment requirements for this draft (cargo, weight, equipment, dates).
      x-domain-action: quote.compose-draft   # x-gap, see section note
      x-resource-type: Quote
      x-gap: "Field shape entirely undesigned -- placeholder object, not a real contract yet."
      parameters:
        - {name: quoteId, in: path, required: true, schema: {type: string}}
        - {name: version, in: path, required: true, schema: {type: integer}}
      requestBody:
        required: true
        content:
          application/json:
            schema: {type: object, additionalProperties: true, description: "UNDESIGNED -- placeholder."}
      responses:
        "200": {description: Updated draft., content: {application/json: {schema: {$ref: "#/components/schemas/QuoteVersion"}}}}

  /quotes/{quoteId}/versions/{version}/route-recommendation:
    put:
      tags: [Draft Composition]
      operationId: putQuoteRouteRecommendation
      summary: Attach the RouteRecommendation this draft is being priced against.
      x-domain-action: quote.compose-draft
      x-resource-type: Quote
      description: >
        This is what makes recommendation_id known -- the precondition for
        D16 to later apply at POST .../price (see file header note).
      parameters:
        - {name: quoteId, in: path, required: true, schema: {type: string}}
        - {name: version, in: path, required: true, schema: {type: integer}}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [recommendation_id, selected_route_id]
              properties:
                recommendation_id:  {type: string, x-owner: agent_state, x-role: references, description: "-> RouteRecommendation."}
                selected_route_id:  {type: string, x-owner: agent_state, x-role: references}
      responses:
        "200": {description: Updated draft., content: {application/json: {schema: {$ref: "#/components/schemas/QuoteVersion"}}}}

  /quotes/{quoteId}/versions/{version}/commercial-terms:
    put:
      tags: [Draft Composition]
      operationId: putQuoteCommercialTerms
      summary: Commercial terms for this draft (payment terms, incoterm, special conditions).
      x-domain-action: quote.compose-draft
      x-resource-type: Quote
      x-gap: "Field shape entirely undesigned -- placeholder object, not a real contract yet."
      parameters:
        - {name: quoteId, in: path, required: true, schema: {type: string}}
        - {name: version, in: path, required: true, schema: {type: integer}}
      requestBody:
        required: true
        content:
          application/json:
            schema: {type: object, additionalProperties: true, description: "UNDESIGNED -- placeholder."}
      responses:
        "200": {description: Updated draft., content: {application/json: {schema: {$ref: "#/components/schemas/QuoteVersion"}}}}

  /quotes/{quoteId}/versions/{version}/pricing-inputs:
    put:
      tags: [Draft Composition]
      operationId: putQuotePricingInputs
      summary: Attach the references R1-R6 will be evaluated against.
      x-domain-action: quote.compose-draft
      x-resource-type: Quote
      parameters:
        - {name: quoteId, in: path, required: true, schema: {type: string}}
        - {name: version, in: path, required: true, schema: {type: integer}}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [fx_rate_ref, pricing_terms_ref, margin_floor_ref]
              properties:
                fx_rate_ref:       {type: string, x-owner: fx_service, x-role: references}
                rate_refs:         {type: array, items: {type: string}, x-owner: rate_management, x-role: references}
                pricing_terms_ref: {type: string, x-owner: qms, x-role: references}
                margin_floor_ref:  {type: string, x-owner: qms, x-role: references}
      responses:
        "200": {description: Updated draft., content: {application/json: {schema: {$ref: "#/components/schemas/QuoteVersion"}}}}

  /quotes/{quoteId}/versions/{version}/validity:
    put:
      tags: [Draft Composition, Validity]
      operationId: putQuoteValidity
      summary: Set or change valid_until for this draft.
      x-domain-action: quote.compose-draft
      x-resource-type: Quote
      parameters:
        - {name: quoteId, in: path, required: true, schema: {type: string}}
        - {name: version, in: path, required: true, schema: {type: integer}}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [valid_until]
              properties:
                valid_until: {type: string, format: date-time, x-owner: qms, x-role: owns}
      responses:
        "200": {description: Updated draft., content: {application/json: {schema: {$ref: "#/components/schemas/QuoteVersion"}}}}

  /quotes/{quoteId}/versions/{version}/assumptions:
    put:
      tags: [Draft Composition]
      operationId: putQuoteAssumptions
      summary: Assumptions this quote's pricing depends on (e.g. weight bracket, expected capacity).
      x-domain-action: quote.compose-draft
      x-resource-type: Quote
      x-gap: "Field shape entirely undesigned -- placeholder object, not a real contract yet."
      parameters:
        - {name: quoteId, in: path, required: true, schema: {type: string}}
        - {name: version, in: path, required: true, schema: {type: integer}}
      requestBody:
        required: true
        content:
          application/json:
            schema: {type: object, additionalProperties: true, description: "UNDESIGNED -- placeholder."}
      responses:
        "200": {description: Updated draft., content: {application/json: {schema: {$ref: "#/components/schemas/QuoteVersion"}}}}

  /quotes/{quoteId}/versions/{version}/exclusions:
    put:
      tags: [Draft Composition]
      operationId: putQuoteExclusions
      summary: What this quote explicitly does NOT cover.
      x-domain-action: quote.compose-draft
      x-resource-type: Quote
      x-gap: "Field shape entirely undesigned -- placeholder object, not a real contract yet."
      parameters:
        - {name: quoteId, in: path, required: true, schema: {type: string}}
        - {name: version, in: path, required: true, schema: {type: integer}}
      requestBody:
        required: true
        content:
          application/json:
            schema: {type: object, additionalProperties: true, description: "UNDESIGNED -- placeholder."}
      responses:
        "200": {description: Updated draft., content: {application/json: {schema: {$ref: "#/components/schemas/QuoteVersion"}}}}

  # ---------------------------------------------------------------- Pricing
  /quotes/{quoteId}/versions/{version}/price:
    post:
      tags: [Pricing]
      operationId: priceQuoteVersion
      summary: draft -> priced. THE atomic command -- resolve, compute R1-R6, authorize D16, write.
      x-domain-action: quote.create-version   # -> D16. This IS where D16 belongs now -- see file header note.
      x-resource-type: Quote
      x-authz-context: [rfq_id, recommendation_id, fx_rate_ref, pricing_terms_ref, margin_floor_ref]
      x-consults:
        - service: fx
          endpoint: "GET /exchange-rates/{base}/{quote}"
          purpose: "resolve fx_rate_ref to an actual rate for currency normalization (R2)"
        - service: masterdata
          endpoint: "GET /currencies/{code}"
          purpose: "minor_unit for correctly rounding total_cost/proposed_sell_price (ADR-010 -- same rounding authority mock-fx's own /convert uses, never duplicated here)"
      description: >
        Requires route-recommendation and pricing-inputs to already be
        composed (400 if not). Atomic: resolve referenced facts -> validate
        freshness/applicability -> calculate charges -> normalize currencies
        -> total cost -> derive sell price -> margin -> evaluate R1-R6 ->
        build Cedar context -> evaluate D16 -> write. On deny, the draft is
        untouched (still draft, not partially priced).
      x-gap: >
        Sell-price origin (from the earlier review, still unresolved): R1 is
        (sell - cost)/sell, but nothing here says who computes the sell
        price -- unless pricing_terms_ref fully determines it. See
        QuoteVersion.proposed_sell_price_eur_cents' x-owner: null.
      parameters:
        - {name: quoteId, in: path, required: true, schema: {type: string}}
        - {name: version, in: path, required: true, schema: {type: integer}}
        - {name: Idempotency-Key, in: header, required: true, schema: {type: string, format: uuid}}
      responses:
        "200":
          description: status=priced.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/PricingResult"}
        "400": {description: "route-recommendation or pricing-inputs not yet composed."}
        "403": {description: "D16 denied -- draft stays draft."}

  /quotes/{quoteId}/versions/{version}/pricing:
    get:
      tags: [Pricing]
      operationId: getQuotePricing
      summary: The customer-facing pricing result (no buy-cost detail).
      x-domain-action: quote.read
      x-resource-type: Quote
      parameters:
        - {name: quoteId, in: path, required: true, schema: {type: string}}
        - {name: version, in: path, required: true, schema: {type: integer}}
      responses:
        "200":
          description: Pricing result.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/PricingResult"}

  /quotes/{quoteId}/versions/{version}/pricing-breakdown:
    get:
      tags: [Pricing]
      operationId: getQuotePricingBreakdown
      summary: Internal breakdown INCLUDING carrier buy costs -- gated separately from the pricing summary.
      x-domain-action: buy-rate.read   # -> D15, same split as /carrier-rates
      x-resource-type: Quote
      parameters:
        - {name: quoteId, in: path, required: true, schema: {type: string}}
        - {name: version, in: path, required: true, schema: {type: integer}}
      responses:
        "200":
          description: Pricing result plus buy-cost line items (only if D15 permits).
          content:
            application/json:
              schema: {$ref: "#/components/schemas/PricingBreakdown"}
        "403": {description: "D15 denied -- use GET .../pricing for the customer-facing summary instead."}

  # -------------------------------------------------------------- Approvals
  /quotes/{quoteId}/versions/{version}/submit-for-approval:
    post:
      tags: [Approvals]
      operationId: submitQuoteVersionForApproval
      summary: priced -> approval_required (or a D4b forbid, if FX moved and this is an automatic replacement).
      x-domain-action: quote.submit-for-approval   # -> D4 / D5 / D12
      x-resource-type: Quote
      x-authz-context: [fx_variance_pct_x10, margin_pct_x10]
      description: >
        D16 (pricing) and this action are separate decisions: pricing never
        implies automatic submission. D5 (below floor) and D12 (baseline,
        FX quiet + margin OK) both permit *submission*, both land on
        approval_required -- they differ in whether submission is currently
        authorized (and which obligation rides along), not in destination
        state. Only D4b changes the outcome shape, by forbidding the attempt
        entirely (403).
      parameters:
        - {name: quoteId, in: path, required: true, schema: {type: string}}
        - {name: version, in: path, required: true, schema: {type: integer}}
      responses:
        "200":
          description: status=approval_required.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/QuoteVersion"}
        "403": {description: "D4b forbid-auto-replace-on-fx."}

  /quotes/{quoteId}/versions/{version}/approval-requirements:
    get:
      tags: [Approvals]
      operationId: getApprovalRequirements
      summary: What triggered thresholds/obligations apply to this version, before deciding.
      x-domain-action: quote.read
      x-resource-type: Quote
      x-gap: "Shape not designed -- likely TriggeredThreshold[] (rfq_common.models, already exists) plus which approver_role each obligation names (authorization/obligations.yaml)."
      parameters:
        - {name: quoteId, in: path, required: true, schema: {type: string}}
        - {name: version, in: path, required: true, schema: {type: integer}}
      responses:
        "200":
          description: Applicable obligations/thresholds.
          content:
            application/json:
              schema: {type: array, items: {type: object, additionalProperties: true}}

  /quotes/{quoteId}/versions/{version}/decisions:
    get:
      tags: [Approvals]
      operationId: listQuoteDecisions
      summary: Approval history for this version -- supporting evidence, not the authoritative signal.
      x-domain-action: quote.read
      x-resource-type: Quote
      parameters:
        - {name: quoteId, in: path, required: true, schema: {type: string}}
        - {name: version, in: path, required: true, schema: {type: integer}}
      responses:
        "200":
          description: Decision records.
          content:
            application/json:
              schema: {type: array, items: {$ref: "#/components/schemas/DecisionRecord"}}
    post:
      tags: [Approvals]
      operationId: decideQuoteVersion
      summary: The human-in-the-loop decision -- approval_required -> approved | rejected | revise.
      x-domain-action: null   # NOT YET MODELED -- see x-gap
      x-resource-type: Quote
      x-gap: >
        D6 only covers "may a commercial manager approve a ROUTE DEVIATION
        within their limit" -- not rejecting, requesting revision, approving
        without a route deviation, or acting on other triggered thresholds
        (margin floor, cost variance, transit variance). A future D19 should
        start from "may this human record this decision on this quote
        version, under the approval requirements that applied when it
        entered approval_required" -- not from mirroring this endpoint.
        `Quote.status` remains the authoritative process signal
        (decisions.md); this record is supporting evidence.
      parameters:
        - {name: quoteId, in: path, required: true, schema: {type: string}}
        - {name: version, in: path, required: true, schema: {type: integer}}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/QuoteDecisionRequest"}
      responses:
        "200":
          description: Updated status; on "revise" the caller still separately calls POST .../versions for the next version.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/QuoteVersion"}

  # ------------------------------------------------------------- Publication
  /quotes/{quoteId}/versions/{version}/publish:
    post:
      tags: [Publication]
      operationId: publishQuoteVersion
      summary: approved -> published. NOT the same as approval -- this is the act of making it customer-visible.
      x-domain-action: quote.publish   # x-gap
      x-resource-type: Quote
      x-gap: >
        No decision governs this yet. Deliberately distinct from D18
        (buy-rate.disclose, which gates WHAT content is visible) -- this
        gates the ACT of publishing at all. Also distinct from
        quote.submit-for-approval: approval and publication conflating into
        one status ("approved" meaning both "a human signed off" and "the
        customer has it") was the exact ambiguity this split resolves.
      parameters:
        - {name: quoteId, in: path, required: true, schema: {type: string}}
        - {name: version, in: path, required: true, schema: {type: integer}}
      responses:
        "200":
          description: status=published.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/QuoteVersion"}

  /quotes/{quoteId}/versions/{version}/withdraw:
    post:
      tags: [Publication]
      operationId: withdrawQuoteVersion
      summary: published -> withdrawn (we pull it back before the customer responds).
      x-domain-action: quote.withdraw   # x-gap
      x-resource-type: Quote
      x-gap: "No decision governs this yet -- who may withdraw, and does it require the same approval authority that published it?"
      parameters:
        - {name: quoteId, in: path, required: true, schema: {type: string}}
        - {name: version, in: path, required: true, schema: {type: integer}}
      requestBody:
        content:
          application/json:
            schema: {type: object, properties: {reason: {type: string}}}
      responses:
        "200":
          description: status=withdrawn.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/QuoteVersion"}

  /quotes/{quoteId}/versions/{version}/customer-view:
    get:
      tags: [Publication, Customer Response]
      operationId: getQuoteCustomerView
      summary: The filtered, customer-facing representation. Makes D18 concrete.
      x-domain-action: buy-rate.disclose   # -> D18
      x-resource-type: Quote
      description: >
        Excludes buy rates, internal margins where confidential, internal
        policy diagnostics, rejected alternatives, and internal comments.
        This is the response shape D18 actually governs -- everything else
        in this file that mentions D18 is really pointing back at this.
      parameters:
        - {name: quoteId, in: path, required: true, schema: {type: string}}
        - {name: version, in: path, required: true, schema: {type: integer}}
      responses:
        "200":
          description: Customer-facing quote view.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/CustomerQuoteView"}
        "403": {description: "D18 denied."}

  # ---------------------------------------------------------------- Documents
  /quotes/{quoteId}/versions/{version}/documents:
    get:
      tags: [Documents]
      operationId: listQuoteDocuments
      summary: Generated documents for this immutable version.
      x-domain-action: quote.read
      x-resource-type: Quote
      parameters:
        - {name: quoteId, in: path, required: true, schema: {type: string}}
        - {name: version, in: path, required: true, schema: {type: integer}}
      responses:
        "200":
          description: Documents.
          content:
            application/json:
              schema: {type: array, items: {$ref: "#/components/schemas/QuoteDocument"}}
    post:
      tags: [Documents]
      operationId: generateQuoteDocument
      summary: Generate a document from this exact version -- must not silently change if pricing config changes later.
      x-domain-action: quote.document.generate   # x-gap
      x-resource-type: Quote
      x-gap: "No decision governs this yet. Also undesigned: document TYPE (proposal PDF vs. formal offer vs. internal summary) and template ownership."
      parameters:
        - {name: quoteId, in: path, required: true, schema: {type: string}}
        - {name: version, in: path, required: true, schema: {type: integer}}
      requestBody:
        content:
          application/json:
            schema: {type: object, properties: {document_type: {type: string}}}
      responses:
        "201":
          description: Document generated, immutably tied to this version.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/QuoteDocument"}

  /quotes/{quoteId}/versions/{version}/documents/{documentId}:
    get:
      tags: [Documents]
      operationId: getQuoteDocument
      summary: Fetch a specific generated document.
      x-domain-action: quote.read
      x-resource-type: Quote
      parameters:
        - {name: quoteId, in: path, required: true, schema: {type: string}}
        - {name: version, in: path, required: true, schema: {type: integer}}
        - {name: documentId, in: path, required: true, schema: {type: string}}
      responses:
        "200":
          description: The document.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/QuoteDocument"}
        "404": {description: No such document.}

  # ------------------------------------------------------- Customer Response
  # x-gap (applies to all three below): these may initially be internal
  # integration endpoints called by CRM or a customer portal, not
  # customer-facing directly. They must not mutate commercial content --
  # accept/reject just transition status; request-change creates a business
  # event and eventually a new version via the normal supersede path, never
  # a direct field edit.
  /quotes/{quoteId}/versions/{version}/accept:
    post:
      tags: [Customer Response]
      operationId: acceptQuoteVersion
      summary: published -> accepted (customer accepted, relayed by CRM/portal).
      x-domain-action: quote.accept   # x-gap
      x-resource-type: Quote
      x-gap: "No decision governs this -- principal is likely 'CRM system' or 'Customer', a new principal kind not yet in identity/claims-contract.md."
      parameters:
        - {name: quoteId, in: path, required: true, schema: {type: string}}
        - {name: version, in: path, required: true, schema: {type: integer}}
      responses:
        "200": {description: status=accepted., content: {application/json: {schema: {$ref: "#/components/schemas/QuoteVersion"}}}}

  /quotes/{quoteId}/versions/{version}/reject:
    post:
      tags: [Customer Response]
      operationId: rejectQuoteVersion
      summary: published -> rejected (customer declined).
      x-domain-action: quote.reject   # x-gap, same principal-kind gap as accept
      x-resource-type: Quote
      parameters:
        - {name: quoteId, in: path, required: true, schema: {type: string}}
        - {name: version, in: path, required: true, schema: {type: integer}}
      requestBody:
        content:
          application/json:
            schema: {type: object, properties: {reason: {type: string}}}
      responses:
        "200": {description: status=rejected., content: {application/json: {schema: {$ref: "#/components/schemas/QuoteVersion"}}}}

  /quotes/{quoteId}/versions/{version}/request-change:
    post:
      tags: [Customer Response]
      operationId: requestQuoteChange
      summary: Customer wants something different -- creates a business event, does NOT edit this version.
      x-domain-action: quote.request-change   # x-gap
      x-resource-type: Quote
      description: >
        Never mutates commercial content directly. Produces a trigger event
        that a subsequent POST .../versions (supersede, D17) consumes --
        same shape as an FX or route-unavailable trigger, just customer-
        originated.
      parameters:
        - {name: quoteId, in: path, required: true, schema: {type: string}}
        - {name: version, in: path, required: true, schema: {type: integer}}
      requestBody:
        content:
          application/json:
            schema: {type: object, properties: {requested_change: {type: string}}}
      responses:
        "202":
          description: Change request recorded as a trigger event; does not itself change quote state.
          content:
            application/json:
              schema: {type: object, properties: {trigger_event_ref: {type: string}}}

  # ----------------------------------------------------------------- Validity
  /quotes/{quoteId}/versions/{version}/expire:
    post:
      tags: [Validity]
      operationId: expireQuoteVersion
      summary: Force expiry before valid_until (vs. the passive expiry a scheduler would apply).
      x-domain-action: quote.expire   # x-gap
      x-resource-type: Quote
      x-gap: "No decision governs manual expiry, and passive (valid_until reached) expiry isn't designed at all -- likely a scheduled job, not this endpoint, but that job's authority is undefined too."
      parameters:
        - {name: quoteId, in: path, required: true, schema: {type: string}}
        - {name: version, in: path, required: true, schema: {type: integer}}
      responses:
        "200": {description: status=expired., content: {application/json: {schema: {$ref: "#/components/schemas/QuoteVersion"}}}}

  /quotes/{quoteId}/versions/{version}/extend-validity:
    post:
      tags: [Validity]
      operationId: extendQuoteValidity
      summary: Push valid_until out -- but if rates/capacity/FX assumptions changed, this should force a new version instead.
      x-domain-action: quote.extend-validity   # x-gap
      x-resource-type: Quote
      x-gap: >
        This command should probably REFUSE (400, "supersede instead") if
        fx_rate_ref/rate_refs are stale relative to now, rather than silently
        extending a quote whose pricing assumptions no longer hold. Staleness
        check not designed.
      parameters:
        - {name: quoteId, in: path, required: true, schema: {type: string}}
        - {name: version, in: path, required: true, schema: {type: integer}}
      requestBody:
        required: true
        content:
          application/json:
            schema: {type: object, required: [new_valid_until], properties: {new_valid_until: {type: string, format: date-time}}}
      responses:
        "200": {description: valid_until updated, status unchanged., content: {application/json: {schema: {$ref: "#/components/schemas/QuoteVersion"}}}}
        "400": {description: "Pricing assumptions are stale -- supersede instead of extending."}

  # --------------------------------------------------- Pricing Configuration
  # Read-only in this draft -- writes (POST /pricing-terms, POST
  # /margin-floors) deliberately excluded: effective-dating and authorization
  # for CHANGING commercial config must be specified before allowing writes,
  # per the earlier review. Listed here as the read side only.
  /customers/{customerId}/pricing-terms:
    get:
      tags: [Pricing Configuration]
      operationId: getCustomerPricingTerms
      summary: Current effective pricing terms for a customer.
      x-domain-action: pricing-terms.read   # x-gap, not in decisions.md
      x-resource-type: CustomerPricingTerms
      parameters:
        - {name: customerId, in: path, required: true, schema: {type: string}}
      responses:
        "200": {description: Effective pricing terms., content: {application/json: {schema: {type: object, additionalProperties: true}}}}

  /customers/{customerId}/margin-floor:
    get:
      tags: [Pricing Configuration]
      operationId: getCustomerMarginFloor
      summary: Current effective margin floor for a customer.
      x-domain-action: margin-floor.read   # x-gap, not in decisions.md
      x-resource-type: MarginFloor
      parameters:
        - {name: customerId, in: path, required: true, schema: {type: string}}
      responses:
        "200": {description: Effective margin floor., content: {application/json: {schema: {type: object, additionalProperties: true}}}}

  /pricing-terms/{pricingTermsId}:
    get:
      tags: [Pricing Configuration]
      operationId: getPricingTermsById
      summary: One pricing-terms revision by id (for margin_floor_ref/pricing_terms_ref resolution).
      x-domain-action: pricing-terms.read
      x-resource-type: CustomerPricingTerms
      parameters:
        - {name: pricingTermsId, in: path, required: true, schema: {type: string}}
      responses:
        "200": {description: One revision., content: {application/json: {schema: {type: object, additionalProperties: true}}}}

  /margin-floors/{marginFloorId}:
    get:
      tags: [Pricing Configuration]
      operationId: getMarginFloorById
      summary: One margin-floor revision by id.
      x-domain-action: margin-floor.read
      x-resource-type: MarginFloor
      parameters:
        - {name: marginFloorId, in: path, required: true, schema: {type: string}}
      responses:
        "200": {description: One revision., content: {application/json: {schema: {type: object, additionalProperties: true}}}}

  # Legacy narrow-slice endpoints, still relevant reads:
  /rfqs/{rfqId}:
    get:
      tags: [Quotes]
      operationId: getRfq
      summary: Read an RFQ -- the pipeline's starting input.
      x-domain-action: rfq.read           # -> D13
      x-resource-type: RFQ
      x-authz-context: [customer_id, region, assignment, rfq_status]
      parameters:
        - {name: rfqId, in: path, required: true, schema: {type: string, example: RFQ-1001}}
      responses:
        "200":
          description: The RFQ.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/RFQ"}
        "404": {description: No such RFQ.}

  /carrier-rates:
    get:
      tags: [Pricing Configuration]
      operationId: listCarrierRates
      summary: Carrier rates for a lane, scoped to what the caller is entitled to see.
      x-domain-action: rate.read          # -> D14
      x-resource-type: CarrierRate
      x-authz-context: [customer_id, contract_scope, rate_type]
      x-consults:
        - service: masterdata
          endpoint: "GET /currencies/{code}"
          purpose: "validate the rate's currency (ADR-010)"
      description: >
        `rate.read` returns identity/lane/currency; `cost_cents` (the
        carrier's actual charge) additionally requires `buy-rate.read` (D15)
        -- same endpoint, field simply absent if D15 doesn't also permit.
      parameters:
        - {name: laneId, in: query, required: true, schema: {type: string}}
        - {name: customerId, in: query, required: false, schema: {type: string}}
      responses:
        "200":
          description: Matching carrier rates.
          content:
            application/json:
              schema: {type: array, items: {$ref: "#/components/schemas/CarrierRate"}}

components:
  securitySchemes:
    apiKey: {type: apiKey, in: header, name: X-API-Key}
  schemas:
    RFQ:
      type: object
      required: [rfq_id, status]
      properties:
        rfq_id:          {type: string, example: RFQ-1001}
        status:          {type: string, example: sourcing_rates}
        customer_id:     {type: string}
        origin:          {type: string}
        destination:     {type: string}
        quote_currency:  {type: string, example: EUR}
        contracted_lane: {type: string, nullable: true}
        region:          {type: string}

    CarrierRate:
      type: object
      required: [rate_id, carrier_id, lane_id, currency]
      properties:
        rate_id:               {type: string, x-owner: rate_management, x-role: references}
        carrier_id:            {type: string, x-owner: masterdata, x-role: references}
        lane_id:               {type: string, x-owner: rate_management, x-role: references}
        currency:              {type: string, x-owner: masterdata, x-role: references}
        cost_cents:            {type: integer, nullable: true, x-owner: rate_management, x-role: references, description: "The carrier's published rate to the forwarder -- present only if buy-rate.read (D15) is also authorized, absent (not zero) otherwise."}
        confidentiality_class: {type: string, example: internal, x-owner: rate_management, x-role: references}

    Quote:
      type: object
      description: The aggregate -- identity + customer/RFQ linkage. Commercial content lives on QuoteVersion.
      required: [quote_id, rfq_id, customer_id]
      properties:
        quote_id:    {type: string, x-owner: qms, x-role: owns}
        rfq_id:      {type: string, x-owner: crm, x-role: references}
        customer_id: {type: string, x-owner: masterdata, x-role: references}
        currency:    {type: string, x-owner: qms, x-role: owns, description: "Set at creation (CreateQuoteRequest); versions may normalize to it."}
        latest_version:      {type: integer, x-owner: qms, x-role: owns}
        latest_version_status: {type: string, x-owner: qms, x-role: owns}
        created_at:  {type: string, format: date-time, x-owner: qms, x-role: owns}

    CreateQuoteRequest:
      type: object
      required: [rfq_id, customer_id, currency]
      properties:
        rfq_id:      {type: string, x-owner: crm, x-role: references}
        customer_id: {type: string, x-owner: masterdata, x-role: references}
        currency:    {type: string, x-owner: qms, x-role: owns, example: EUR}

    CreateNextVersionRequest:
      type: object
      required: [prior_version, expected_latest_version, trigger_event_ref]
      properties:
        prior_version:           {type: integer, x-owner: qms, x-role: owns}
        expected_latest_version: {type: integer, x-owner: caller, x-role: references, description: "Concurrency precondition -- mismatch is 409, not 403."}
        change_reason:           {type: string, example: route_unavailable}
        trigger_event_ref:       {type: string, x-owner: varies, x-role: references}
        copy_from_prior:         {type: boolean, default: true, description: "Whether composed draft fields (shipment/commercial-terms/etc.) carry forward or must be re-supplied."}

    QuoteVersion:
      type: object
      required: [quote_id, version, status]
      properties:
        quote_id:                    {type: string, x-owner: qms, x-role: owns}
        version:                     {type: integer, x-owner: qms, x-role: owns}
        prior_version:               {type: integer, nullable: true, x-owner: qms, x-role: owns}
        status:
          type: string
          x-owner: qms
          x-role: owns
          enum: [draft, priced, approval_required, approved, published, accepted, rejected, revise, expired, withdrawn]
          description: "The human-in-the-loop decision (approval_required -> approved|rejected|revise) is a status change (decisions.md). published/accepted/rejected/expired/withdrawn are new in this pass -- see the Publication/Customer Response/Validity sections for what governs each."
        currency:                    {type: string, x-owner: qms, x-role: computes}
        total_cost_eur_cents:        {type: integer, nullable: true, x-owner: qms, x-role: computes, description: "Null until priced."}
        proposed_sell_price_eur_cents: {type: integer, nullable: true, x-owner: null, x-role: computes, description: "x-owner left null on purpose -- see POST .../price's x-gap on sell-price origin."}
        margin_pct_x10:              {type: integer, nullable: true, x-owner: qms, x-role: computes, description: "R1 -- (sell - cost) / sell * 1000"}
        fx_variance_pct_x10:         {type: integer, nullable: true, x-owner: qms, x-role: computes, description: "R2, only once compared against a later current rate"}
        valid_until:                 {type: string, format: date-time, nullable: true, x-owner: qms, x-role: owns}
        created_at:                  {type: string, format: date-time, x-owner: qms, x-role: owns}
        created_by:                  {type: string, x-owner: qms, x-role: owns, description: "Principal id (agent or human)."}
        authorization_decision_ids:  {type: array, items: {type: string}, x-owner: qms, x-role: owns, description: "determining_policies from every Cedar call this version triggered -- rfq_common.pdp.AuthorizationDecision.determining_policies."}
        pricing_rule_results:        {type: array, items: {type: string}, x-owner: qms, x-role: owns, description: "Which of R1-R6 fired and their computed values."}
        recommendation_id:           {type: string, nullable: true, x-owner: agent_state, x-role: references}
        rate_refs:                   {type: array, items: {type: string}, x-owner: rate_management, x-role: references}
        fx_rate_ref:                 {type: string, nullable: true, x-owner: fx_service, x-role: references}
        pricing_terms_ref:           {type: string, nullable: true, x-owner: qms, x-role: references}
        margin_floor_ref:            {type: string, nullable: true, x-owner: qms, x-role: references}
        trigger_event_ref:           {type: string, nullable: true, x-owner: varies, x-role: references}

    PricingResult:
      type: object
      description: Customer-facing pricing result -- no buy-cost detail (see PricingBreakdown for that, D15-gated).
      properties:
        currency:                      {type: string}
        total_cost_cents:               {type: integer}
        proposed_sell_price_cents:      {type: integer}
        margin_pct_x10:                  {type: integer}
        rule_results:
          type: array
          items:
            type: object
            properties:
              rule_id:            {type: string, example: R1}
              actual_pct_x10:     {type: integer}
              threshold_pct_x10:  {type: integer}
              result:             {type: string, enum: [within_threshold, below_floor, over_threshold]}

    PricingBreakdown:
      allOf:
        - {$ref: "#/components/schemas/PricingResult"}
        - type: object
          properties:
            buy_cost_line_items:
              type: array
              items:
                type: object
                properties:
                  rate_id:    {type: string}
                  cost_cents: {type: integer}

    DecisionRecord:
      type: object
      required: [decision, approver, decided_at]
      properties:
        decision:   {type: string, enum: [approved, rejected, revise]}
        approver:   {type: string, x-owner: qms, x-role: owns, description: "Principal id (human)."}
        reason:     {type: string, nullable: true}
        decided_at: {type: string, format: date-time, x-owner: qms, x-role: owns}

    QuoteDecisionRequest:
      type: object
      required: [decision, approver]
      properties:
        decision: {type: string, enum: [approved, rejected, revise]}
        approver: {type: string}
        reason:   {type: string, nullable: true}

    CustomerQuoteView:
      type: object
      description: What D18 actually governs -- excludes buy rates, confidential margins, policy diagnostics, rejected alternatives, internal comments.
      properties:
        quote_id:                  {type: string}
        version:                   {type: integer}
        currency:                  {type: string}
        proposed_sell_price_cents: {type: integer}
        valid_until:               {type: string, format: date-time}
        route_summary:             {type: string, description: "Human-readable, not the internal RouteOption/RouteRecommendation shape."}

    QuoteDocument:
      type: object
      required: [document_id, document_type, quote_id, quote_version, generated_at]
      properties:
        document_id:   {type: string, x-owner: qms, x-role: owns}
        document_type: {type: string, example: proposal_pdf}
        quote_id:      {type: string, x-owner: qms, x-role: owns}
        quote_version: {type: integer, x-owner: qms, x-role: owns, description: "Immutable reference -- regenerating from a later pricing-config change must produce a NEW document, never mutate this one."}
        generated_at:  {type: string, format: date-time, x-owner: qms, x-role: owns}
        url:           {type: string, nullable: true}

    ChangeEvent:
      type: object
      properties:
        from_version: {type: integer, nullable: true}
        to_version:   {type: integer}
        changed_fields: {type: array, items: {type: string}}
        trigger_event_ref: {type: string, nullable: true}

    TimelineEntry:
      type: object
      properties:
        version:     {type: integer}
        status:      {type: string}
        occurred_at: {type: string, format: date-time}

    AuditEvent:
      type: object
      properties:
        action:                 {type: string, example: "quote.create-version"}
        authorization_decision_id: {type: string}
        principal:               {type: string}
        occurred_at:              {type: string, format: date-time}
