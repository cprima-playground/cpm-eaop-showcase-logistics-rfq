[project]
name = "rfq-geo-tools"
version = "0.1.0"
description = "Route geometry generation (route_geometry.py) + Leaflet viewer for systems/tms/fixtures/routes.yaml. See POSTMORTEM.md."
requires-python = ">=3.11"
dependencies = [
    "pyproj>=3.6",
    "pyyaml>=6.0",
    "shapely>=2.0",
    "pyshp>=2.3",
    "numpy>=1.26",
]

[tool.uv]
package = false
