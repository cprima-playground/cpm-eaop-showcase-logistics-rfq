[project]
name = "commercial-normalization-agent"
version = "0.1.0"
description = "M5 (remaining scope): third real A2A server. Exposes normalize-route-cost as an A2A skill; invokes route-decision-agent (A2A) for a route recommendation, wraps it as a commercially-normalized option. First agent in the full 3-hop chain -> route-decision-agent -> lane-evaluation-agent -> tms-mcp."
requires-python = ">=3.10"
dependencies = [
    "rfq-common",
    "a2a-sdk[fastapi]>=1.1.2",
    "uvicorn>=0.30",
    "httpx>=0.27",
]

[dependency-groups]
dev = ["pytest>=8.0", "pytest-asyncio>=0.24", "route-decision-agent", "lane-evaluation-agent", "tms-mcp", "mock-tms"]

[tool.uv.sources]
rfq-common = { path = "../rfq_common", editable = true }
route-decision-agent = { path = "../route-decision-agent", editable = true }
lane-evaluation-agent = { path = "../lane-evaluation-agent", editable = true }
tms-mcp = { path = "../tms-mcp", editable = true }
mock-tms = { path = "../mock-tms", editable = true }

[tool.uv]
package = true

[tool.pytest.ini_options]
asyncio_mode = "auto"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["commercial_normalization_agent"]

[project.scripts]
commercial-normalization-agent = "commercial_normalization_agent.cli:main"
