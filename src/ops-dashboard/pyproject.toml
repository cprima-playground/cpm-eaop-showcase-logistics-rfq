[project]
name = "ops-dashboard"
version = "0.1.0"
description = "Read-only ops dashboard over TMS/Rate/Masterdata -- the first frontend + human SSO login in RfQ, deliberately simple (no writes, no domain state machine) to prove the plumbing before CPQ."
requires-python = ">=3.10"
dependencies = [
    "rfq-common",
    "uvicorn>=0.30",
    "jinja2>=3.1",
    "itsdangerous>=2.2",
    "pyjwt>=2.9",
]

[dependency-groups]
dev = ["pytest>=8.0"]

[tool.uv.sources]
rfq-common = { path = "../rfq_common", editable = true }

[tool.uv]
package = true

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["ops_dashboard"]

[project.scripts]
ops-dashboard = "ops_dashboard.cli:main"
