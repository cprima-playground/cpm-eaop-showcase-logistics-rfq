[project]
name = "approval-mcp"
version = "0.1.0"
description = "M6: fourth authenticated MCP server. Two genuinely agent-facing tools: record_recommendation (route-deviation.propose, gated on live QuoteVersion.status=='draft' via additional_entities) and resume_route_decision (route.recommend, real business-state precondition -- a decision must exist -- plus the pre-existing context-based D3a/D3b/D8/D9 policies). Does NOT expose create_approval_task or get_approval_status -- neither has a real Cedar action mapping (Finding 2), so neither is agent-invokable here regardless of tools.yaml listing them. Built directly on M5.5's shared settings/descriptor/self-check contract."
requires-python = ">=3.10"
dependencies = [
    "rfq-common",
    "uvicorn>=0.30",
    "httpx>=0.27",
]

[dependency-groups]
dev = ["pytest>=8.0", "mock-qms"]

[tool.uv.sources]
rfq-common = { path = "../rfq_common", editable = true }
mock-qms = { path = "../mock-qms", editable = true }

[tool.uv]
package = true

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["approval_mcp"]

[project.scripts]
approval-mcp = "approval_mcp.cli:main"
