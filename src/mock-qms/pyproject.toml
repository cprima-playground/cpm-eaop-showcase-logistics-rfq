[project]
name = "mock-qms"
version = "0.1.0"
description = "Quote Management System (QMS) -- every path from interfaces/api/qms.openapi.yaml is a real, typed FastAPI route (null-op 501 bodies) -- no Quote store, R1-R6 pricing math, or Cedar wiring yet (business/qms-pricing-rules.md)."
requires-python = ">=3.10"
dependencies = [
    "rfq-common",
    "uvicorn>=0.30",
    "jinja2>=3.1",
    "itsdangerous>=2.2",
    "pyjwt>=2.9",
    "python-multipart>=0.0.9",
]

[dependency-groups]
dev = ["pytest>=8.0"]

[tool.uv.sources]
rfq-common = { path = "../rfq_common", editable = true }

[tool.uv]
package = true

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["mock_qms"]

[project.scripts]
mock-qms = "mock_qms.cli:main"
