[project]
name = "rate-mcp"
version = "0.1.0"
description = "M6: second authenticated MCP server -- one tool (get_contract_rate), OAuth-authenticated agent-to-MCP access with distributed Cedar enforcement, calling mock-rate with its own workload credential. Built directly on M5.5's shared settings/descriptor/self-check contract."
requires-python = ">=3.10"
dependencies = [
    "rfq-common",
    "uvicorn>=0.30",
    "httpx>=0.27",
]

[dependency-groups]
dev = ["pytest>=8.0", "mock-rate"]

[tool.uv.sources]
rfq-common = { path = "../rfq_common", editable = true }
mock-rate = { path = "../mock-rate", editable = true }

[tool.uv]
package = true

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["rate_mcp"]

[project.scripts]
rate-mcp = "rate_mcp.cli:main"
