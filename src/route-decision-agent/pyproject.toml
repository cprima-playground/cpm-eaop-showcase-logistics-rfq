[project]
name = "route-decision-agent"
version = "0.1.0"
description = "M5b: second A2A hop. Exposes recommend-route as an A2A skill; invokes lane-evaluation-agent (A2A) for capacity evidence, combines it into a route recommendation. Proves agent -> agent -> agent -> MCP."
requires-python = ">=3.10"
dependencies = [
    "rfq-common",
    "a2a-sdk[fastapi]>=1.1.2",
    "uvicorn>=0.30",
    "httpx>=0.27",
]

[dependency-groups]
dev = ["pytest>=8.0", "pytest-asyncio>=0.24", "lane-evaluation-agent", "tms-mcp", "mock-tms"]

[tool.uv.sources]
rfq-common = { path = "../rfq_common", editable = true }
lane-evaluation-agent = { path = "../lane-evaluation-agent", editable = true }
tms-mcp = { path = "../tms-mcp", editable = true }
mock-tms = { path = "../mock-tms", editable = true }

[tool.uv]
package = true

[tool.pytest.ini_options]
asyncio_mode = "auto"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["route_decision_agent"]

[project.scripts]
route-decision-agent = "route_decision_agent.cli:main"
