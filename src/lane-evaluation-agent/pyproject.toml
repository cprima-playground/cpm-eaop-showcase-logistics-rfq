[project]
name = "lane-evaluation-agent"
version = "0.1.0"
description = "M5a: real A2A server. Exposes evaluate-lane-capacity as an A2A skill; internally calls tms-mcp (MCP, not A2A) to execute it. First real A2A slice on top of M6a's secured MCP checkpoint."
requires-python = ">=3.10"
dependencies = [
    "rfq-common",
    "a2a-sdk[fastapi]>=1.1.2",
    "uvicorn>=0.30",
    "httpx>=0.27",
]

[dependency-groups]
dev = ["pytest>=8.0", "pytest-asyncio>=0.24", "tms-mcp", "mock-tms"]

[tool.uv.sources]
rfq-common = { path = "../rfq_common", editable = true }
tms-mcp = { path = "../tms-mcp", editable = true }
mock-tms = { path = "../mock-tms", editable = true }

[tool.uv]
package = true

[tool.pytest.ini_options]
asyncio_mode = "auto"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["lane_evaluation_agent"]

[project.scripts]
lane-evaluation-agent = "lane_evaluation_agent.cli:main"
