[project]
name = "mock-fx"
version = "0.1.0"
description = "Mock Corporate FX Service (build-plan.md Phase 2, first system) -- deterministic, seeded from real historical rates, mocked per interfaces/api/fx-api.md."
requires-python = ">=3.10"
dependencies = [
    "rfq-common",
    "uvicorn>=0.30",
]

[dependency-groups]
dev = ["pytest>=8.0"]

[tool.uv.sources]
rfq-common = { path = "../rfq_common", editable = true }

[tool.uv]
package = true

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["mock_fx"]

[project.scripts]
mock-fx = "mock_fx.cli:main"
