[project]
name = "mock-tms"
version = "0.1.0"
description = "Mock TMS -- route topology (stable) + operational availability overlay (volatile). Locations referenced via masterdata, never embedded (ADR-010)."
requires-python = ">=3.10"
dependencies = [
    "rfq-common",
    "uvicorn>=0.30",
    "pyyaml>=6.0",
]

[dependency-groups]
dev = ["pytest>=8.0"]

[tool.uv.sources]
rfq-common = { path = "../rfq_common", editable = true }

[tool.uv]
package = true

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["mock_tms"]

[project.scripts]
mock-tms = "mock_tms.cli:main"
